<!DOCTYPE html>
<!-- html5-qrcode v2.3.8 — vendored from https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Iron Jungle — Counter Sales</title>
<script src="vendor/html5-qrcode.min.js"></script>
<style>
  /* ============================================================
     Iron Jungle — counter kiosk
     Direction: "Chalk & Plates". Light ground because the real scene is a
     gym counter under bright fluorescents, where a dark screen mirrors the
     room and every fingerprint. Identity comes from the subject's own
     world: chalk, charcoal rubber, and the colour-coding of competition
     plates — colour as identification, not decoration.
     System fonts only: the offline guarantee forbids a font CDN.
     ============================================================ */
  :root {
    --chalk:      #EEF0F3;
    --card:       #FFFFFF;
    --ink:        #15171C;
    --ink-soft:   #616A79;
    --rule:       #D8DCE3;

    /* Plate colours. Assigned per item by id, so an item keeps its colour
       for life and members recognise it without reading. */
    --plate-red:    #C62828;
    --plate-blue:   #1457B8;
    --plate-amber:  #B35A00;
    --plate-green:  #1F7A3D;
    --plate-violet: #6A3FB5;
    --plate-teal:   #0F6E6E;

    --danger:     #B3261E;
    --radius:     18px;
    --tap:        88px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--chalk);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    /* Kiosk hardening — the page is an always-on appliance. */
    touch-action: manipulation;
    overscroll-behavior-y: none;
    -webkit-touch-callout: none;
  }

  /* The enrollment name field is a real text input. The kiosk-wide
     user-select:none above is right for the rest of the screen, but a member
     who can't place a caret to fix a typo will abandon. */
  input {
    user-select: text;
    -webkit-user-select: text;
  }

  .screen { display: none; height: 100%; padding: 28px 32px 24px; }
  .screen.active { display: flex; flex-direction: column; }

  /* ---------- shared type ---------- */
  .eyebrow {
    font-size: 13px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-soft);
    text-align: center;
  }
  .hint { font-size: 17px; color: var(--ink-soft); text-align: center; }

  /* ---------- idle / scan ---------- */
  #idle { align-items: center; justify-content: flex-start; gap: 14px; }

  .idle-title {
    font-size: clamp(30px, 4.6vw, 46px);
    font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
    text-align: center;
  }

  /* Corner brackets tell a hurried person where to aim the barcode. */
  .scan-frame {
    position: relative;
    width: min(460px, 74vw);
    aspect-ratio: 1 / 1;
    margin-top: 4px;
    border-radius: var(--radius);
    background: #0E1013;
    overflow: hidden;
  }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  .scan-frame span {
    position: absolute; width: 34px; height: 34px; pointer-events: none;
    border: 4px solid var(--card); border-radius: 4px;
  }
  .scan-frame span:nth-of-type(1) { top: 14px; left: 14px;  border-right: 0; border-bottom: 0; }
  .scan-frame span:nth-of-type(2) { top: 14px; right: 14px; border-left: 0;  border-bottom: 0; }
  .scan-frame span:nth-of-type(3) { bottom: 14px; left: 14px;  border-right: 0; border-top: 0; }
  .scan-frame span:nth-of-type(4) { bottom: 14px; right: 14px; border-left: 0;  border-top: 0; }

  .error {
    color: var(--danger); font-size: 18px; font-weight: 600;
    text-align: center; max-width: 34ch; line-height: 1.35;
  }

  /* ---------- locked: greeting ---------- */
  .member-bar {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; padding-bottom: 14px; border-bottom: 2px solid var(--rule);
  }
  .member-name {
    font-size: clamp(26px, 3.6vw, 38px); font-weight: 800; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .linkish {
    background: none; border: 0; color: var(--ink-soft);
    font-size: 17px; font-weight: 600; text-decoration: underline;
    text-underline-offset: 4px; padding: 10px 4px; flex: none;
  }

  /* ---------- quantity ---------- */
  .qty-row {
    display: flex; align-items: center; justify-content: center;
    gap: 22px; padding: 16px 0 6px;
  }
  .qty-row button {
    width: var(--tap); height: 64px;
    font-size: 30px; font-weight: 700; color: var(--ink);
    background: var(--card); border: 2px solid var(--rule);
    border-radius: 14px;
  }
  .qty-row button:active { background: var(--chalk); }
  .qty-row button:disabled { opacity: .3; }
  .qty-label {
    font-size: 13px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  #qty-value {
    font-size: 34px; font-weight: 800; min-width: 56px; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- product grid ---------- */
  #catalog-container { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 14px; }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    /* Grow to fill a wide landscape screen, but stop before portrait
       stretches each tile into a mostly-empty rectangle. */
    grid-auto-rows: minmax(132px, 186px);
    gap: 14px;
    align-content: start;
  }
  .product-btn {
    position: relative;
    min-height: 132px;
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; align-items: flex-start;
    justify-content: space-between; gap: 10px;
    text-align: left;
    background: var(--card);
    border: 2px solid var(--rule);
    border-radius: var(--radius);
    color: var(--ink);
    /* The plate colour reads as a weight-plate edge down the left side. */
    border-left: 10px solid var(--plate, var(--ink));
    transition: transform .06s ease-out, background-color .06s ease-out;
  }
  .product-btn .name {
    font-size: 23px; font-weight: 700; line-height: 1.15; letter-spacing: -.015em;
  }
  .product-btn .price {
    font-size: 27px; font-weight: 800; color: var(--plate, var(--ink));
    font-variant-numeric: tabular-nums;
  }
  .product-btn:active { transform: scale(.97); background: var(--chalk); }
  .product-btn:disabled { opacity: .35; }

  /* ---------- enrollment ---------- */
  .enroll-wrap { display: flex; flex-direction: column; gap: 18px; max-width: 560px; width: 100%; margin: 0 auto; }
  .enroll-title {
    font-size: clamp(26px, 3.6vw, 38px); font-weight: 800;
    letter-spacing: -.02em; line-height: 1.1;
  }
  #name-input {
    width: 100%; padding: 20px 22px;
    font: inherit; font-size: 26px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 2px solid var(--rule); border-radius: 14px;
  }
  #name-input:focus { outline: 3px solid var(--plate-blue); outline-offset: 2px; }

  .btn-primary {
    min-height: 68px; padding: 0 28px;
    font-size: 21px; font-weight: 700; color: #fff;
    background: var(--ink); border: 0; border-radius: 14px;
  }
  .btn-primary:disabled { background: var(--rule); color: var(--ink-soft); }
  .btn-primary:active:not(:disabled) { opacity: .85; }

  .cancel-btn {
    margin-top: auto; min-height: 60px;
    font-size: 18px; font-weight: 600; color: var(--ink-soft);
    background: none; border: 2px solid var(--rule); border-radius: 14px;
  }
  .cancel-btn:active { background: var(--card); }

  /* ---------- success: the signature moment ----------
     A full-bleed flood in the item's own colour, legible from across the
     room so a member walking away knows it registered — and knows WHICH
     item registered, which is what catches a mis-tap. */
  #success {
    background: var(--flood, var(--ink));
    color: #fff;
    align-items: center; justify-content: center; gap: 10px;
    text-align: center;
  }
  .success-check {
    font-size: 56px; line-height: 1; margin-bottom: 4px;
  }
  .success-item {
    font-size: clamp(38px, 7vw, 76px); font-weight: 800;
    letter-spacing: -.03em; line-height: 1;
  }
  .success-who { font-size: clamp(18px, 2.4vw, 24px); font-weight: 600; opacity: .82; }

  @media (prefers-reduced-motion: no-preference) {
    #success.active .success-item,
    #success.active .success-check { animation: rise .22s cubic-bezier(.2,.7,.3,1) both; }
    #success.active .success-who { animation: rise .22s cubic-bezier(.2,.7,.3,1) .04s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }

  /* ---------- admin ---------- */
  #admin { gap: 16px; }
  .admin-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; border-bottom: 2px solid var(--rule);
  }
  .admin-head h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  #admin-batches { flex: 1; overflow-y: auto; }
  #admin-batches h3 {
    font-size: 13px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px;
  }
  .batch {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 2px solid var(--rule);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
  }
  .batch-id { font-weight: 700; font-variant-numeric: tabular-nums; }
  .batch-meta { color: var(--ink-soft); font-size: 15px; }
  .pill {
    font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; color: #fff;
  }
  .pill.pending   { background: var(--plate-amber); }
  .pill.processed { background: var(--plate-green); }
  .batch .spacer { flex: 1; }
  .btn-sm {
    min-height: 48px; padding: 0 18px; font-size: 16px; font-weight: 700;
    border-radius: 12px; border: 2px solid var(--rule);
    background: var(--card); color: var(--ink);
  }
  .btn-sm.solid { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-danger {
    min-height: 52px; padding: 0 18px; font-size: 16px; font-weight: 700;
    border-radius: 12px; background: none;
    border: 2px solid var(--danger); color: var(--danger);
  }
  .admin-foot { display: flex; gap: 12px; align-items: center; }
  .warn-note {
    background: #FDECEA; border: 2px solid #F5C6C2; color: var(--danger);
    border-radius: 12px; padding: 12px 14px; font-weight: 600; margin-bottom: 12px;
  }
  .empty { color: var(--ink-soft); font-size: 17px; padding: 8px 2px; }

  /* ---------- print: the worker's sheet ---------- */
  @media print {
    body { background: #fff; color: #000; overflow: visible; }
    .screen, #reader, #admin, #idle, #locked, #success { display: none !important; }
    #print-container { display: block !important; padding: 0; }
    #print-container h1 { font-size: 20pt; margin-bottom: 2pt; }
    #print-container .sub { font-size: 10pt; color: #444; margin-bottom: 12pt; }
    table { width: 100%; border-collapse: collapse; font-size: 11pt; }
    th { text-align: left; border-bottom: 2px solid #000; padding: 6pt 4pt; font-size: 9pt;
         text-transform: uppercase; letter-spacing: .08em; }
    td { border-bottom: 1px solid #ccc; padding: 6pt 4pt; }
    tr.member-start td { border-top: 2px solid #000; }
    .total-row td { font-weight: 700; border-top: 2px solid #000; border-bottom: 0; }
  }
</style>
</head>
<body>

<div id="idle" class="screen">
  <p class="eyebrow">Iron Jungle</p>
  <h2 class="idle-title" id="idle-title">Scan your gym barcode</h2>
  <div class="scan-frame">
    <div id="reader"></div>
    <span></span><span></span><span></span><span></span>
  </div>
  <p class="hint">Card or phone &mdash; hold it steady</p>
  <p id="scanner-error" class="error" hidden></p>
</div>

<div id="locked" class="screen">
  <div id="catalog-container"></div>
</div>

<div id="success" class="screen"></div>
<div id='admin' class='screen'>
  <div class="admin-head">
    <h2>Sales admin</h2>
    <button class="btn-sm" onclick='returnToIdle()'>Back to kiosk</button>
  </div>
  <div id='admin-batches'></div>
  <div class="admin-foot">
    <button class="btn-primary" id="create-batch-btn" onclick='doCreateBatch()'>Create batch</button>
    <span class="batch-meta" id="waiting-note"></span>
    <span class="spacer" style="flex:1"></span>
    <button class="btn-danger" onclick='doClearData()'>Clear all data</button>
  </div>
</div>
<div id="print-container" style="display: none;"></div>

<script>
'use strict';

/* ============================================================
 * Task 3 — Product catalog
 *
 * FILL IN: The catalog below contains placeholder items and prices.
 * Replace with the real fridge and shelf contents when known.
 * Prices are integer cents ($3.50 = 350).
 * ============================================================ */
const CATALOG = [
  { id: 'water',         name: 'Bottled Water',      sku: 'water',         price: 150 },
  { id: 'gatorade',      name: 'Gatorade',           sku: 'gatorade',      price: 250 },
  { id: 'protein-bar',   name: 'Protein Bar',        sku: 'protein-bar',   price: 300 },
  { id: 'energy-drink',  name: 'Energy Drink',       sku: 'energy-drink',  price: 350 },
  { id: 'pre-workout',   name: 'Pre-Workout Scoop',  sku: 'pre-workout',   price: 200 },
  { id: 'protein-shake', name: 'RTD Protein Shake',  sku: 'protein-shake', price: 450 },
  { id: 'shaker-cup',    name: 'Shaker Bottle',      sku: 'shaker-cup',    price: 800 },
  { id: 'lifting-straps',name: 'Lifting Straps',     sku: 'lifting-straps',price: 1200 }
];

/**
 * Validate catalog integrity. Throws loudly on duplicate id, duplicate sku,
 * missing or empty name, or invalid price.
 */
function validateCatalog(catalog) {
  if (!Array.isArray(catalog) || catalog.length === 0) {
    throw new Error('Catalog must be a non-empty array');
  }
  const ids = new Set();
  const skus = new Set();
  for (const item of catalog) {
    if (!item.id || typeof item.id !== 'string') {
      throw new Error(`Catalog item missing valid id: ${JSON.stringify(item)}`);
    }
    if (ids.has(item.id)) {
      throw new Error(`Duplicate catalog id: "${item.id}"`);
    }
    ids.add(item.id);

    if (!item.sku || typeof item.sku !== 'string') {
      throw new Error(`Catalog item "${item.id}" missing valid sku`);
    }
    if (skus.has(item.sku)) {
      throw new Error(`Duplicate catalog sku: "${item.sku}"`);
    }
    skus.add(item.sku);

    if (!item.name || typeof item.name !== 'string' || item.name.trim() === '') {
      throw new Error(`Catalog item "${item.id}" has empty or missing name`);
    }

    if (typeof item.price !== 'number' || !Number.isInteger(item.price) || item.price < 0) {
      throw new Error(`Catalog item "${item.id}" has invalid price (must be non-negative integer cents): ${item.price}`);
    }
  }
  return true;
}

// Startup validation — fail fast if catalog is broken
validateCatalog(CATALOG);

function formatPrice(cents) {
  return '$' + (cents / 100).toFixed(2);
}

/* Plate colours, borrowed from competition weight plates where colour IS the
   weight. Derived from the item id so it is stable for the life of the item —
   a regular learns "Gatorade is the blue one" and stops reading labels. Adding
   a catalog item needs no colour decision. */
const PLATE_VARS = ['--plate-red', '--plate-blue', '--plate-amber',
                    '--plate-green', '--plate-violet', '--plate-teal'];

function plateVar(id) {
  // By catalog position, so neighbouring tiles never share a colour — two
  // green tiles side by side defeats the whole point of colour-as-identity.
  // Falls back to a hash for items no longer in the catalog, so an old sale
  // still resolves to a stable colour on a reprint.
  const i = CATALOG.findIndex(item => item.id === id);
  if (i !== -1) return PLATE_VARS[i % PLATE_VARS.length];
  let h = 0;
  for (let k = 0; k < id.length; k++) h = (h * 31 + id.charCodeAt(k)) >>> 0;
  return PLATE_VARS[h % PLATE_VARS.length];
}

/**
 * Render product grid into a target element.
 */
function renderProductGrid(container, catalog, onItemClick) {
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'product-grid';
  for (const item of catalog) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'product-btn';
    btn.dataset.productId = item.id;
    btn.style.setProperty('--plate', 'var(' + plateVar(item.id) + ')');
    // Enabled only while a member is locked in. The grid is rendered from
    // updateLockedScreen(), so this is normally true — but it must be derived
    // from state, never hardcoded: hardcoding `true` here left the buttons
    // permanently dead, because nothing ever set them back to false.
    btn.disabled = state !== 'locked';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = item.name;

    const priceSpan = document.createElement('span');
    priceSpan.className = 'price';
    priceSpan.textContent = formatPrice(item.price);

    btn.appendChild(nameSpan);
    btn.appendChild(priceSpan);

    if (onItemClick) {
      btn.addEventListener('click', () => onItemClick(item));
    }
    grid.appendChild(btn);
  }
  container.appendChild(grid);
}

/* ============================================================
 * Storage layer (Task 2)
 * ============================================================ */

const STORAGE_KEY = 'ij.v1';

function defaultState() {
  return {
    schema: 1,
    members: {},
    sales: [],
    batches: []
  };
}

let corrupted = false;

function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    return defaultState();
  }
  if (!raw) return defaultState();

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    quarantine(STORAGE_KEY);
    corrupted = true;
    return defaultState();
  }

  if (!parsed || parsed.schema !== 1) {
    quarantine(STORAGE_KEY);
    corrupted = true;
    return defaultState();
  }

  const state = defaultState();
  state.members = parsed.members && typeof parsed.members === 'object' ? parsed.members : {};
  state.sales = Array.isArray(parsed.sales) ? parsed.sales : [];
  state.batches = Array.isArray(parsed.batches) ? parsed.batches : [];
  return state;
}

function quarantine(key) {
  try {
    const raw = localStorage.getItem(key);
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const badKey = key + '.corrupt.' + stamp;
    if (raw !== null) localStorage.setItem(badKey, raw);
    localStorage.removeItem(key);
  } catch (e) {}
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    return false;
  }
}

function addSale(sale) {
  const state = loadState();
  state.sales.push(sale);
  return saveState(state);
}

/* ============================================================
 * Task 4 — Scanner state machine
 * ============================================================ */
// State machine: idle -> locked -> recording -> success -> idle
let state = 'idle';
let currentBadgeId = null;
let scannerInstance = null;
let currentQty = 1;
// Timestamp before which scans are ignored. A badge left sitting in frame
// re-decodes continuously, so a plain "pause the camera" is not enough on its own.
let scanLockoutUntil = 0;

// Lockout duration for secondary guard (ms)
const LOCKOUT_MS = 3000;
/**
 * Shape of a real gym keytag, e.g. "IJG18399". Code 39 carries no check digit,
 * so a partial or smudged read can decode to a plausible-but-wrong ID — and a
 * wrong ID that happens to match another member bills that member. Anything
 * that doesn't look like a card is ignored, exactly as if it never decoded.
 * CALIBRATION KNOB: loosen this if the gym issues a different card format.
 */
const BADGE_RE = /^[A-Z0-9][A-Z0-9-]{3,31}$/;

/**
 * Normalize a decoded barcode to a badge ID, or return null if it isn't one.
 * Code 39 is uppercase-only and some readers include the `*` start/stop
 * delimiters, so strip those before matching.
 */
function normalizeBadgeId(decodedText) {
  if (typeof decodedText !== 'string') return null;
  const clean = decodedText.trim().toUpperCase().replace(/^\*+|\*+$/g, '');
  return BADGE_RE.test(clean) ? clean : null;
}
const MAX_QTY = 10;

/**
 * Enters idle state and starts the camera.
 */
function enterIdle() {
  state = 'idle';
  currentBadgeId = null;
  showScreen('idle');
  // First entry creates and starts the scanner; every later entry resumes the
  // paused one. startScanner() early-returns when an instance exists, so
  // calling only that left the camera paused forever after the first sale.
  if (scannerInstance) resumeScanner(); else startScanner();
}

/**
 * Enters locked state: pauses camera and shows item grid.
 */
function enterLocked(badgeId) {
  if (state !== 'idle') return; // ignore if not idle
  state = 'locked';
  currentBadgeId = badgeId;
  currentQty = 1;
  pauseScanner();
  showScreen('locked');
  updateLockedScreen();
}

/**
 * Enters recording state: disables all product buttons synchronously.
 */
function enterRecording() {
  if (state !== 'locked') return;
  state = 'recording';
  // Sync disable of product buttons
  const productButtons = document.querySelectorAll('.product-btn');
  productButtons.forEach(btn => btn.disabled = true);
  showScreen('locked'); // remain on locked screen
}

/**
 * Enters success state: shows confirmation for 2s then returns to idle.
 */
function enterSuccess(sale) {
  if (state !== 'recording') return;
  state = 'success';
  // Flood the screen in the item's own plate colour — readable from across
  // the room, and it names the item so a mis-tap is caught immediately.
  const scr = document.getElementById('success');
  scr.style.setProperty('--flood', 'var(' + plateVar(sale.productId) + ')');
  scr.innerHTML = `
    <div class="success-check" aria-hidden="true">&check;</div>
    <div class="success-item">${escapeHtml(sale.productName)}${sale.qty > 1 ? ' &times; ' + sale.qty : ''}</div>
    <div class="success-who">Charged to ${escapeHtml(sale.memberName)}</div>
  `;
  showScreen('success');
  setTimeout(() => {
    // Clear the name off the screen before the next member walks up.
    document.getElementById('success').innerHTML = '';
    armScanLockout();
    enterIdle();
  }, 2000);
}

/**
 * Returns to idle from any state (e.g., cancel).
 */
function returnToIdle() {
  armScanLockout();
  enterIdle();
}

/**
 * Secondary guard: ignore scans for LOCKOUT_MS after leaving a purchase, so a
 * badge still sitting in front of the camera cannot instantly start another one.
 */
function armScanLockout() {
  scanLockoutUntil = Date.now() + LOCKOUT_MS;
}

/* ============================================================
 * UI / Screen management
 * ============================================================ */
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

/**
 * Trim, collapse internal whitespace, enforce length. Returns null if invalid.
 */
function sanitizeName(raw) {
  if (typeof raw !== 'string') return null;
  const trimmed = raw.trim().replace(/\s+/g, ' ');
  if (trimmed.length === 0 || trimmed.length > 40) return null;
  return trimmed;
}

/**
 * Bind (or rebind) the current badge to a name. Returns true on success.
 * Past sales keep their own memberName snapshot and are untouched.
 */
function enrollCurrentBadge(name) {
  const clean = sanitizeName(name);
  if (!clean) return false;
  const s = loadState();
  s.members[currentBadgeId] = { name: clean, enrolledAt: new Date().toISOString() };
  return saveState(s);
}

function updateLockedScreen(forceEnroll) {
  const locked = document.getElementById('locked');
  const member = forceEnroll ? null : loadState().members[currentBadgeId];

  if (member) {
    locked.innerHTML = `
      <div class="member-bar">
        <span class="member-name">Hi, ${escapeHtml(member.name)}</span>
        <button class="linkish" id="not-me-btn">Not you?</button>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <button id="qty-minus" aria-label="One fewer">&minus;</button>
        <span id="qty-value">1</span>
        <button id="qty-plus" aria-label="One more">+</button>
      </div>
      <div id="catalog-container"></div>
      <button class="cancel-btn" id="cancel-btn">Cancel</button>
    `;
    // Re-prompt for a name instead of just bouncing to idle — the old code
    // deleted from a throwaway loadState() copy, so the bad name never cleared.
    document.getElementById('not-me-btn').addEventListener('click', () => {
      updateLockedScreen(true);
    });
    wireQtyStepper();
    wireCancel();
    renderProductGrid(document.getElementById('catalog-container'), CATALOG, onProductTap);
  } else {
    locked.innerHTML = `
      <div class="enroll-wrap">
        <h2 class="enroll-title">First time &mdash; what&rsquo;s your name?</h2>
        <p class="hint" style="text-align:left">We only ask once. Next time your badge just works.</p>
        <input type="text" id="name-input" placeholder="Your name" maxlength="40"
               autocomplete="off" autocapitalize="words" spellcheck="false">
        <button class="btn-primary" id="enroll-btn" disabled>Save my name</button>
      </div>
      <button class="cancel-btn" id="cancel-btn">Cancel</button>
    `;
    const nameInput = document.getElementById('name-input');
    const enrollBtn = document.getElementById('enroll-btn');

    nameInput.addEventListener('input', () => {
      enrollBtn.disabled = sanitizeName(nameInput.value) === null;
    });
    enrollBtn.addEventListener('click', () => {
      if (!enrollCurrentBadge(nameInput.value)) {
        showFatal('Could not save. Tell the front desk.');
        return;
      }
      // Re-render into the greeting + item grid for the member we just enrolled.
      updateLockedScreen();
    });
    wireCancel();
    nameInput.focus();
  }
}

function wireCancel() {
  const btn = document.getElementById('cancel-btn');
  if (btn) btn.addEventListener('click', returnToIdle);
}

function wireQtyStepper() {
  const valueEl = document.getElementById('qty-value');
  const minus = document.getElementById('qty-minus');
  const plus = document.getElementById('qty-plus');
  const render = () => {
    valueEl.textContent = String(currentQty);
    minus.disabled = currentQty <= 1;
    plus.disabled = currentQty >= MAX_QTY;
  };
  minus.addEventListener('click', () => { if (currentQty > 1) currentQty--; render(); });
  plus.addEventListener('click', () => { if (currentQty < MAX_QTY) currentQty++; render(); });
  render();
}

function onProductTap(product) {
  // enterRecording() disables every product button synchronously, in this same
  // handler, so a double-tap on a lagging button cannot produce two sales.
  if (state !== 'locked') return;
  enterRecording();
  recordSale(product);
}

/**
 * HTML escape helper to prevent XSS.
 */
function escapeHtml(text) {
  // Previous version mapped each character to itself, so it escaped nothing.
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

/**
 * Unrecoverable-for-the-member error. Returns the kiosk to a usable state
 * rather than leaving it wedged mid-purchase.
 */
function showFatal(message) {
  alert(message);
  returnToIdle();
}

/* ============================================================
 * Task 6 — Sale capture
 * ============================================================ */
function recordSale(product) {
  if (state !== 'recording') return;
  
  // Build sale with snapshots
  const member = loadState().members[currentBadgeId];
  const sale = {
    id: crypto.randomUUID(),
    badgeId: currentBadgeId,
    memberName: member ? member.name : 'Unknown',
    productId: product.id,
    productName: product.name,   // snapshot
    sku: product.sku,            // snapshot
    price: product.price,        // snapshot (cents)
    qty: currentQty,
    at: new Date().toISOString(),
    batchId: null
  };
  
  // A failed write must never reach the success screen.
  if (addSale(sale)) {
    enterSuccess(sale);
  } else {
    // Go back to 'locked' and re-enable the grid so the member can retry.
    // Previously this left state='recording' with every button disabled,
    // wedging the kiosk until someone reloaded it.
    alert('Could not save that sale. Please tap the item again.');
    state = 'locked';
    updateLockedScreen();
  }
}

/* ============================================================
 * Task 7 — Export batches
 * ============================================================ */
function createBatch() {
  const state = loadState();
  const pendingSales = state.sales.filter(s => s.batchId === null);
  if (pendingSales.length === 0) return null;

  const batchId = crypto.randomUUID();
  pendingSales.forEach(s => { s.batchId = batchId; });
  
  const batch = {
    id: batchId,
    createdAt: new Date().toISOString(),
    saleIds: pendingSales.map(s => s.id),
    status: 'pending',
    processedAt: null
  };
  state.batches.push(batch);
  if (saveState(state)) return batch;
  return null;
}

function printBatch(batchId) {
  const state = loadState();
  const batch = state.batches.find(b => b.id === batchId);
  if (!batch) return;

  const batchSales = state.sales.filter(s => s.batchId === batchId);
  const grouped = batchSales.reduce((acc, s) => {
    if (!acc[s.memberName]) acc[s.memberName] = [];
    acc[s.memberName].push(s);
    return acc;
  }, {});

  const members = Object.keys(grouped).sort();
  const lineCount = batchSales.length;
  const totalCents = batchSales.reduce((sum, s) => sum + s.price * s.qty, 0);

  const container = document.getElementById('print-container');
  // Grouped by member so the worker keys one person's whole tab before
  // switching accounts. A rule above each member's first row makes the
  // groups scannable when you are halfway down the page.
  container.innerHTML = `
    <h1>Iron Jungle &mdash; counter sales</h1>
    <p class="sub">
      Batch ${escapeHtml(batchId.slice(0, 8))} &middot;
      ${new Date(batch.createdAt).toLocaleString()} &middot;
      ${lineCount} ${lineCount === 1 ? 'line' : 'lines'} &middot;
      ${members.length} ${members.length === 1 ? 'member' : 'members'}
    </p>
    <table>
      <thead>
        <tr><th>Member</th><th>Item</th><th>Qty</th><th>Amount</th><th>Time</th></tr>
      </thead>
      <tbody>
        ${members.map(m => grouped[m].map((s, i) => `
          <tr${i === 0 ? ' class="member-start"' : ''}>
            <td>${i === 0 ? escapeHtml(m) : ''}</td>
            <td>${escapeHtml(s.productName)}</td>
            <td>${s.qty}</td>
            <td>${formatPrice(s.price * s.qty)}</td>
            <td>${new Date(s.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</td>
          </tr>
        `).join('')).join('')}
        <tr class="total-row">
          <td>Total</td><td></td><td></td>
          <td>${formatPrice(totalCents)}</td><td></td>
        </tr>
      </tbody>
    </table>
  `;
  window.print();
}

function confirmBatch(batchId) {
  const state = loadState();
  const batch = state.batches.find(b => b.id === batchId);
  if (!batch) return false;
  // Refuse to re-confirm an already-processed batch. A second call must not
  // overwrite processedAt (that would silently move a confirmed batch's
  // timestamp and could re-key an export that was already entered).
  if (batch.status === 'processed') return false;
  batch.status = 'processed';
  batch.processedAt = new Date().toISOString();
  return saveState(state);
}

/* ============================================================
 * Task 8 — PIN-gated admin + the three Task 7 report gaps
 * ============================================================ */

// FILL IN: placeholder admin PIN. Change to the real PIN before the iPad goes
// on the counter.
var ADMIN_PIN = '0311';

let adminAttempts = 0;
let adminLockoutUntil = 0;
const ADMIN_MAX_ATTEMPTS = 3;
const ADMIN_LOCKOUT_MS = 30 * 1000;

function tryAdminUnlock(pin) {
  if (adminLockoutRemainingMs() > 0) return false;
  if (pin === ADMIN_PIN) {
    resetAdminLockout();
    return true;
  }
  adminAttempts++;
  if (adminAttempts >= ADMIN_MAX_ATTEMPTS) {
    adminLockoutUntil = Date.now() + ADMIN_LOCKOUT_MS;
  }
  return false;
}

function adminLockoutRemainingMs() {
  const remaining = adminLockoutUntil - Date.now();
  return remaining > 0 ? remaining : 0;
}

function resetAdminLockout() {
  adminAttempts = 0;
  adminLockoutUntil = 0;
}

function pendingSaleCount() {
  const state = loadState();
  return state.sales.filter(s => s.batchId === null).length;
}

function listAdminBatches() {
  const state = loadState();
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const pending = state.batches.filter(b => b.status === 'pending');
  const processed = state.batches.filter(b => {
    if (b.status !== 'processed') return false;
    const at = b.processedAt ? new Date(b.processedAt).getTime() : 0;
    return at >= cutoff;
  });
  return pending.concat(processed);
}

function clearAllData(confirmText) {
  const state = loadState();
  if (state.batches.some(b => b.status === 'pending')) {
    return { ok: false, reason: 'pending' };
  }
  if (confirmText !== 'CLEAR') {
    return { ok: false, reason: 'confirm' };
  }
  state.sales = [];
  state.batches = [];
  state.members = {};
  return saveState(state) ? { ok: true } : { ok: false, reason: 'save' };
}

function doCreateBatch() {
  if (createBatch()) {
    alert('Batch created.');
    renderAdmin();
  } else {
    alert('No sales to batch.');
  }
}

function doConfirmBatch(id) {
  if (confirmBatch(id)) {
    alert('Batch marked processed.');
    renderAdmin();
  } else {
    alert('Already processed, or not found.');
  }
}

function renderAdmin() {
  const container = document.getElementById('admin-batches');
  const batches = listAdminBatches();
  const unexported = pendingSaleCount();

  const corruptNote = corrupted
    ? '<p class="warn-note">Storage was quarantined as corrupt at last load. ' +
      'Earlier sales may be missing.</p>'
    : '';

  const rows = batches.map(b => {
    const pending = b.status === 'pending';
    return `
      <div class="batch">
        <span class="batch-id">Batch ${b.id.slice(0, 8)}</span>
        <span class="pill ${pending ? 'pending' : 'processed'}">${pending ? 'Pending' : 'Keyed in'}</span>
        <span class="batch-meta">${b.saleIds.length} ${b.saleIds.length === 1 ? 'sale' : 'sales'}</span>
        <span class="spacer"></span>
        <button class="btn-sm" onclick='printBatch("${b.id}")'>Print</button>
        ${pending ? `<button class="btn-sm solid" onclick='doConfirmBatch("${b.id}")'>Confirm keyed</button>` : ''}
      </div>
    `;
  }).join('');

  const empty = batches.length ? '' :
    `<p class="empty">No batches yet. ${unexported
      ? unexported + ' sale' + (unexported === 1 ? '' : 's') + ' waiting \u2014 create a batch to print them.'
      : 'Sales will appear here once members start buying.'}</p>`;

  container.innerHTML = corruptNote + '<h3>Batches</h3>' + rows + empty;

  // Put the waiting count next to the action it affects, and don't offer a
  // button that would do nothing.
  const createBtn = document.getElementById('create-batch-btn');
  const note = document.getElementById('waiting-note');
  if (createBtn) createBtn.disabled = unexported === 0;
  if (note) {
    note.textContent = unexported === 0
      ? 'Nothing waiting'
      : unexported + ' sale' + (unexported === 1 ? '' : 's') + ' waiting';
  }
}

function doClearData() {
  const count = pendingSaleCount();
  const r = clearAllData(prompt(
    'This will permanently delete ' + count +
    ' unexported sale(s), all members and all sales. Type CLEAR to confirm.'
  ));
  if (!r.ok) {
    alert(r.reason === 'pending'
      ? 'Cannot clear while a batch is pending. Confirm it first.'
      : 'Clear cancelled — you must type CLEAR exactly.');
    return;
  }
  alert('All data cleared.');
  renderAdmin();
}

function showAdminPinPrompt() {
  const pin = prompt('Admin PIN:');
  if (pin === null) return;
  if (tryAdminUnlock(pin)) {
    renderAdmin();
    showScreen('admin');
  } else {
    const remaining = adminLockoutRemainingMs();
    alert(remaining > 0
      ? 'Locked out for ' + Math.ceil(remaining / 1000) + 's.'
      : 'Incorrect PIN.');
  }
}

// Long-press (~800ms) the idle title is the ONLY route into the admin screen.
// Hiding the screen is not gating it — the pin check above is.
function wireAdminEntry() {
  const title = document.getElementById('idle-title');
  if (!title) return;
  let pressTimer = null;
  const start = () => {
    if (pressTimer) clearTimeout(pressTimer);
    pressTimer = setTimeout(showAdminPinPrompt, 800);
  };
  const cancel = () => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  };
  title.addEventListener('touchstart', start);
  title.addEventListener('touchend', cancel);
  title.addEventListener('touchcancel', cancel);
  title.addEventListener('mousedown', start);
  title.addEventListener('mouseup', cancel);
  title.addEventListener('mouseleave', cancel);
}
wireAdminEntry();

/* ============================================================
 * Scanner Integration (Task 1 + 4)
 * ============================================================ */
function startScanner() {
  if (scannerInstance) return;
  try {
    // formatsToSupport is read by the CONSTRUCTOR only — the library ignores it
    // in start()'s config. Gym keytags are Code 39 ("IJG18399"); Code 128 is
    // here because the same alphanumeric payload is sometimes encoded that way.
    // CALIBRATION KNOB: if a member's card won't read, add its format here, not
    // in start(). Deliberately NOT enabling ITF/UPC/EAN — no gym card uses them
    // and ITF happily decodes part of a symbol as a valid shorter code, which
    // would hand us a plausible wrong badge ID.
    scannerInstance = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_128
      ]
    });
  } catch (e) {
    // Thrown synchronously when the #reader element is missing.
    console.error('Failed to construct scanner:', e);
    showScannerError('Scanner failed to load. Tell the front desk.');
    return;
  }
  // start() is async — a denied or missing camera rejects the promise and is
  // NOT catchable by a try/catch around this call.
  scannerInstance.start(
    // MUST be exactly one key. The library rejects any other shape with
    // "'cameraIdOrConfig' object should have exactly 1 key" — resolution hints
    // belong in videoConstraints below, not here.
    { facingMode: "environment" },
    {
      fps: 10,
      // CALIBRATION KNOB. Gym keytags are a wide, short strip; a square box
      // crops the start/stop bars out of frame and nothing decodes, ever.
      //
      // The vertical fraction is deliberately generous. The library maps this
      // region to source pixels with videoWidth/clientWidth per axis, i.e. it
      // assumes the video is STRETCHED to fill #reader — but our CSS forces
      // object-fit: cover, which crops instead. With a 16:9 stream in a square
      // frame that mismatch means a short box decodes only the middle slice of
      // what the member can actually see, so a card held high or low in the
      // corner brackets looks aimed and silently never reads.
      //
      // Both dimensions must stay >= 50px or start() throws.
      qrbox: function (vw, vh) {
        return {
          width: Math.max(50, Math.floor(vw * 0.9)),
          height: Math.max(50, Math.floor(vh * 0.8))
        };
      },
      // 720p, not 1080p. Because the region above is now large, 1080p would put
      // ~1.5MP through the decoder ten times a second and throttle an iPad on a
      // gym shift; 720p across a generous region costs about the same as the old
      // 250px square while actually covering the barcode, and still leaves ~1150
      // source pixels across the strip — plenty for Code 39's narrow bars.
      // When present this replaces cameraIdOrConfig for getUserMedia, so it has
      // to carry facingMode itself.
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    },
    onScanSuccess,
    onScanError
  ).catch(e => {
    console.error('Failed to start camera:', e);
    // Name the reason. A config error and a denied permission are both "camera
    // unavailable" from the counter, and sending a worker into Settings for a
    // config bug wasted a gym visit once already.
    showScannerError('Camera unavailable (' + String(e && e.message || e).slice(0, 60) +
      '). Check camera permission in Settings, then reload.');
  });
}

function pauseScanner() {
  try {
    if (scannerInstance) scannerInstance.pause(true);
  } catch (e) {
    console.warn('pause failed:', e);
  }
}

function resumeScanner() {
  try {
    if (scannerInstance) scannerInstance.resume();
  } catch (e) {
    // Resuming a scanner that is already scanning throws; harmless.
    console.warn('resume failed:', e);
  }
}

function onScanSuccess(decodedText) {
  // Primary guard: only accept scans from idle state
  if (state !== 'idle') return;
  // Secondary guard: a badge left sitting in frame must not immediately
  // re-trigger when the camera resumes after the previous sale.
  if (Date.now() < scanLockoutUntil) return;

  // Reject anything that isn't shaped like a gym card BEFORE pausing the
  // camera — a garbage read must look like no read at all, not stall the kiosk.
  const badgeId = normalizeBadgeId(decodedText);
  if (!badgeId) {
    console.warn('Ignoring implausible badge read:', decodedText);
    return;
  }

  // Pause camera immediately (primary fix)
  pauseScanner();

  currentBadgeId = badgeId;
  enterLocked(currentBadgeId);
}

function onScanError() {
  // Called for EVERY frame that fails to decode — ~10/sec, all day, while the
  // kiosk sits idle with nothing in front of the lens. Logging here grew the
  // console buffer without bound on a device nobody can open a console on.
  // Intentionally empty: a frame that doesn't decode is not an error.
}

function showScannerError(message) {
  // Write into a dedicated node — replacing the whole idle screen would
  // destroy #reader, which the scanner needs to mount into.
  const el = document.getElementById('scanner-error');
  el.textContent = message;
  el.hidden = false;
}

/* ============================================================
 * Task 2 & 3 — demo() self-checks (updated for state machine)
 * ============================================================ */
function demoStorage() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  // This function is destructive — it clears storage and writes garbage on
  // purpose. Snapshot everything first and restore it on the way out, so
  // running it against a kiosk that holds real sales cannot lose them.
  const snapshot = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    snapshot[k] = localStorage.getItem(k);
  }
  const wasCorrupted = corrupted;
  try {

  localStorage.clear();
  const s1 = loadState();
  assert(s1.schema === 1 && Array.isArray(s1.sales) && Array.isArray(s1.batches), 'default shape has schema=1');

  const sale = {
    id: 's-test-1', badgeId: 'B1', memberName: 'Jane D.',
    productId: 'water', productName: 'Water', sku: 'water',
    price: 200, qty: 1, at: new Date().toISOString(), batchId: null
  };
  assert(addSale(sale) === true, 'addSale returns true');
  assert(loadState().sales.length === 1, 'sale round-trips');

  const origSet = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function () { throw new Error('QuotaExceededError'); };
  assert(addSale(Object.assign({}, sale, { id: 's-test-2' })) === false, 'addSale returns false when setItem throws');
  localStorage.setItem = origSet;
  assert(loadState().sales.length === 1, 'failed addSale does not persist');

  localStorage.setItem(STORAGE_KEY, '{not valid json!!');
  const s4 = loadState();
  assert(corrupted === true, 'corrupted flag set after garbage write');
  assert(s4.sales.length === 0, 'loadState quarantines');

  } finally {
    // Restore the real data and the real corruption flag.
    localStorage.clear();
    for (const k of Object.keys(snapshot)) localStorage.setItem(k, snapshot[k]);
    corrupted = wasCorrupted;
  }

  return results;
}

function demoCatalog() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  assert(validateCatalog(CATALOG) === true, 'default CATALOG is valid');

  let dupSkuThrew = false;
  try {
    validateCatalog([
      { id: 'a', name: 'A', sku: 'DUP', price: 100 },
      { id: 'b', name: 'B', sku: 'DUP', price: 200 }
    ]);
  } catch (e) {
    dupSkuThrew = true;
  }
  assert(dupSkuThrew, 'duplicate SKU throws at startup');

  let dupIdThrew = false;
  try {
    validateCatalog([
      { id: 'DUP', name: 'A', sku: 'a', price: 100 },
      { id: 'DUP', name: 'B', sku: 'b', price: 200 }
    ]);
  } catch (e) {
    dupIdThrew = true;
  }
  assert(dupIdThrew, 'duplicate id throws at startup');

  let emptyNameThrew = false;
  try {
    validateCatalog([{ id: 'a', name: '   ', sku: 'a', price: 100 }]);
  } catch (e) {
    emptyNameThrew = true;
  }
  assert(emptyNameThrew, 'empty name throws at startup');

  return results;
}

/* ============================================================
 * Task 4 — State machine self-check
 * ============================================================ */
function demoScanner() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  // Reset state
  state = 'idle';
  currentBadgeId = null;
  scanLockoutUntil = 0;

  // Mock scanner functions
  let paused = false;
  const mockPause = () => { paused = true; };
  const mockResume = () => { paused = false; };
  
  // Temporarily replace scanner functions
  const originalPause = pauseScanner;
  const originalResume = resumeScanner;
  const originalInstance = scannerInstance;
  pauseScanner = mockPause;
  resumeScanner = mockResume;
  // Stand in for a started camera. enterIdle() resumes an existing instance and
  // only constructs one when there is none, so without this the cancel test
  // takes the construct path and never calls resume.
  scannerInstance = scannerInstance || {};

  try {
    // Test: idle -> scan -> locked
    onScanSuccess('TEST_BADGE');
    assert(state === 'locked', 'First scan should lock state');
    assert(paused === true, 'Scanner should pause on lock');
    
    // Test: locked -> second scan ignored
    const wasPaused = paused;
    onScanSuccess('OTHER_BADGE');
    assert(state === 'locked', 'State should remain locked');
    assert(paused === wasPaused, 'Scanner pause state should be unchanged');
    
    // Test: cancel returns to idle and resumes
    returnToIdle();
    assert(state === 'idle', 'Cancel should return to idle');
    assert(paused === false, 'Scanner should resume after cancel');
    
  } finally {
    // Restore original functions
    pauseScanner = originalPause;
    resumeScanner = originalResume;
    scannerInstance = originalInstance;
  }

  return results;
}

/**
 * Self-checks are DEVELOPER tools and must never run on their own.
 *
 * They used to run on every page load. demoStorage() clears localStorage and
 * writes garbage to the real key, so every reload of the kiosk quarantined the
 * live data as corrupt and started empty — a full day of uncollected sales
 * destroyed by any reload, iOS memory-pressure relaunch, or Guided Access
 * restart. Silent, and with a false "storage was corrupt" banner on top.
 *
 * Opt in explicitly with ?selftest=1 when you want them.
 */
function runSelfChecks() {
  return {
    storage: demoStorage(),
    catalog: demoCatalog(),
    scanner: demoScanner()
  };
}
if (typeof window !== 'undefined' && window.location
    && /[?&]selftest=1\b/.test(window.location.search)) {
  console.log('Self-checks:', runSelfChecks());
}

/* ============================================================
 * Startup
 *
 * This must be explicit. The app previously booted only by accident: the
 * self-checks auto-ran on load and demoScanner() called returnToIdle(), which
 * happened to show the idle screen. Removing that auto-run left every .screen
 * hidden and the page blank.
 * ============================================================ */
if (typeof window !== 'undefined' && window.document) {
  enterIdle();
}
</script>
</body>
</html>
