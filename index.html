<!DOCTYPE html>
<!-- html5-qrcode v2.3.8 — vendored from https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Iron Jungle — Counter Sales</title>
<script src="vendor/html5-qrcode.min.js"></script>
<style>
  /* ============================================================
     Iron Jungle — counter kiosk
     Direction: "Chalk & Plates". Light ground because the real scene is a
     gym counter under bright fluorescents, where a dark screen mirrors the
     room and every fingerprint. Identity comes from the subject's own
     world: chalk, charcoal rubber, and the colour-coding of competition
     plates — colour as identification, not decoration.
     System fonts only: the offline guarantee forbids a font CDN.
     ============================================================ */
  :root {
    --chalk:      #EEF0F3;
    --card:       #FFFFFF;
    --ink:        #15171C;
    --ink-soft:   #616A79;
    --rule:       #D8DCE3;

    /* Plate colours. Assigned per item by id, so an item keeps its colour
       for life and members recognise it without reading. */
    --plate-red:    #C62828;
    --plate-blue:   #1457B8;
    --plate-amber:  #B35A00;
    --plate-green:  #1F7A3D;
    --plate-violet: #6A3FB5;
    --plate-teal:   #0F6E6E;

    --danger:     #B3261E;
    --radius:     18px;
    --tap:        88px;
  }

  /* touch-action is NOT inherited, so setting it on body alone left every
     child on the default `auto` — which is why a fast double-tap on the iPad
     still triggered Safari's smart zoom, scrolled the content up and left the
     bottom of the screen black. It has to be set on everything. */
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

  /* overflow on html too — the document element is the scroller on iOS, and
     body { overflow: hidden } alone does not stop it being displaced. */
  /* overscroll-behavior belongs on the SCROLLER, which on iOS is the document
     element — having it only on body (below) left the elastic drag in place.
     This is what remains after the content overflow was fixed: the page had
     nothing to scroll but iOS still let you pull it and bounce back. */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--chalk);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    /* Kiosk hardening — the page is an always-on appliance. */
    touch-action: manipulation;
    overscroll-behavior-y: none;
    -webkit-touch-callout: none;
  }

  /* The enrollment name field is a real text input. The kiosk-wide
     user-select:none above is right for the rest of the screen, but a member
     who can't place a caret to fix a typo will abandon. */
  input {
    user-select: text;
    -webkit-user-select: text;
  }

  .screen { display: none; height: 100%; padding: 28px 32px 24px; }
  .screen.active { display: flex; flex-direction: column; }

  /* ---------- shared type ---------- */
  .eyebrow {
    font-size: 13px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-soft);
    text-align: center;
  }

  /* The gym's own mark, in the slot the text eyebrow used to hold. Served as
     a file rather than inlined base64: it is the same same-origin pattern as
     vendor/html5-qrcode.min.js, it caches on its own, and 60KB of base64 in
     the middle of index.html would make hand-editing CATALOG and ADMIN_PIN
     miserable. The PNG has a real alpha channel, so it sits straight on the
     chalk background with no card behind it. */
  .brand {
    display: block; align-self: center; height: auto;
    width: min(240px, 46vw); margin-bottom: 2px;
  }
  /* Sized in the report so the logo heads the sheet without dominating it. */
  .brand-report { display: block; width: 200px; height: auto; margin-bottom: 6px; }
  .hint { font-size: 17px; color: var(--ink-soft); text-align: center; }

  /* ---------- idle / scan ---------- */
  #idle { align-items: center; justify-content: flex-start; gap: 14px; }

  .idle-title {
    font-size: clamp(30px, 4.6vw, 46px);
    font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
    text-align: center;
  }

  /* Corner brackets tell a hurried person where to aim the barcode. */
  .scan-frame {
    position: relative;
    width: min(460px, 74vw);
    aspect-ratio: 1 / 1;
    margin-top: 4px;
    border-radius: var(--radius);
    background: #0E1013;
    overflow: hidden;
  }
  #reader { width: 100%; height: 100%; }
  /* pointer-events: none — nothing on the video is interactive, and a <video>
     is the one element iOS reserves its own double-tap behaviour for. */
  /* display:block — a <video> is inline-level, and its baseline gap left 4px
     of overflow behind even after the canvas was taken out of flow. */
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover;
                  pointer-events: none; display: block; }
  /* html5-qrcode appends its scratch canvas AFTER the <video>, in normal flow,
     and with no qrbox it sizes that canvas to the whole element. So #reader
     held 460px of video plus 460px of canvas — 927px of content in a 460px
     box — and iOS pans an overflow area like that even under overflow:hidden.
     That was the screen dragging up and down. The canvas is a decode surface
     and was never meant to be seen: take it out of flow and stop painting it.
     A 2D context keeps working either way. overflow:hidden on #reader too, so
     anything else the library appends cannot recreate a pannable area. */
  #reader { overflow: hidden; }
  #reader canvas { position: absolute; top: 0; left: 0; visibility: hidden; }
  .scan-frame span {
    position: absolute; width: 34px; height: 34px; pointer-events: none;
    border: 4px solid var(--card); border-radius: 4px;
  }
  .scan-frame span:nth-of-type(1) { top: 14px; left: 14px;  border-right: 0; border-bottom: 0; }
  .scan-frame span:nth-of-type(2) { top: 14px; right: 14px; border-left: 0;  border-bottom: 0; }
  .scan-frame span:nth-of-type(3) { bottom: 14px; left: 14px;  border-right: 0; border-top: 0; }
  .scan-frame span:nth-of-type(4) { bottom: 14px; right: 14px; border-left: 0;  border-top: 0; }

  .error {
    color: var(--danger); font-size: 18px; font-weight: 600;
    text-align: center; max-width: 34ch; line-height: 1.35;
  }

  /* ---------- locked: greeting ---------- */
  .member-bar {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; padding-bottom: 14px; border-bottom: 2px solid var(--rule);
  }
  .member-name {
    font-size: clamp(26px, 3.6vw, 38px); font-weight: 800; letter-spacing: -.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .linkish {
    background: none; border: 0; color: var(--ink-soft);
    font-size: 17px; font-weight: 600; text-decoration: underline;
    text-underline-offset: 4px; padding: 10px 4px; flex: none;
  }

  /* ---------- quantity ---------- */
  .qty-row {
    display: flex; align-items: center; justify-content: center;
    gap: 22px; padding: 16px 0 6px;
  }
  .qty-row button {
    width: var(--tap); height: 64px;
    font-size: 30px; font-weight: 700; color: var(--ink);
    background: var(--card); border: 2px solid var(--rule);
    border-radius: 14px;
  }
  .qty-row button:active { background: var(--chalk); }
  .qty-row button:disabled { opacity: .3; }
  .qty-label {
    font-size: 13px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  #qty-value {
    font-size: 34px; font-weight: 800; min-width: 56px; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- product grid ---------- */
  /* contain — without it, flicking the grid past its end chains the
     overscroll to the document and drags the whole page. */
  #catalog-container { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 14px;
                       overscroll-behavior: contain; }
  /* Category tabs. Kiosk-sized targets, and they scroll sideways rather than
     wrap if the labels ever outgrow the width. */
  #cat-tabs {
    display: flex; gap: 10px; margin-bottom: 12px; flex: 0 0 auto;
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  #cat-tabs[hidden] { display: none; }
  .cat-tab {
    flex: 0 0 auto; min-height: 56px; padding: 0 22px;
    font-size: 17px; font-weight: 700; white-space: nowrap;
    border-radius: 12px; border: 2px solid var(--rule);
    background: var(--card); color: var(--ink-soft);
  }
  .cat-tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    /* Grow to fill a wide landscape screen, but stop before portrait
       stretches each tile into a mostly-empty rectangle. */
    grid-auto-rows: minmax(132px, 186px);
    gap: 14px;
    align-content: start;
  }
  .product-btn {
    position: relative;
    min-height: 132px;
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; align-items: flex-start;
    justify-content: space-between; gap: 10px;
    text-align: left;
    background: var(--card);
    border: 2px solid var(--rule);
    border-radius: var(--radius);
    color: var(--ink);
    /* The plate colour reads as a weight-plate edge down the left side. */
    border-left: 10px solid var(--plate, var(--ink));
    transition: transform .06s ease-out, background-color .06s ease-out;
  }
  .product-btn .name {
    font-size: 23px; font-weight: 700; line-height: 1.15; letter-spacing: -.015em;
  }
  .product-btn .price {
    font-size: 27px; font-weight: 800; color: var(--plate, var(--ink));
    font-variant-numeric: tabular-nums;
  }
  .product-btn:active { transform: scale(.97); background: var(--chalk); }
  .product-btn:disabled { opacity: .35; }

  /* ---------- enrollment ---------- */
  .enroll-wrap { display: flex; flex-direction: column; gap: 18px; max-width: 560px; width: 100%; margin: 0 auto; }
  .enroll-title {
    font-size: clamp(26px, 3.6vw, 38px); font-weight: 800;
    letter-spacing: -.02em; line-height: 1.1;
  }
  #name-input {
    width: 100%; padding: 20px 22px;
    font: inherit; font-size: 26px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 2px solid var(--rule); border-radius: 14px;
  }
  #name-input:focus { outline: 3px solid var(--plate-blue); outline-offset: 2px; }

  /* ---------- typed member number ----------
     Same weight and size as the enrollment input: this is the same act (typing
     your identity on a counter screen), so it must feel like the same thing. */
  .typed-wrap { display: flex; flex-direction: column; gap: 18px; max-width: 560px; width: 100%; margin: 0 auto; }
  #typed-number, #typed-name {
    width: 100%; padding: 20px 22px;
    font: inherit; font-size: 26px; font-weight: 600; color: var(--ink);
    background: var(--card); border: 2px solid var(--rule); border-radius: 14px;
  }
  /* Card numbers are printed uppercase; show them that way so a typed ID is
     visually identical to the one on the card. */
  #typed-number { text-transform: uppercase; letter-spacing: .06em; }
  #typed-number::placeholder, #typed-name::placeholder {
    text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-soft);
  }
  #typed-number:focus, #typed-name:focus { outline: 3px solid var(--plate-blue); outline-offset: 2px; }
  #type-number-btn { margin-top: 2px; }

  .btn-primary {
    min-height: 68px; padding: 0 28px;
    font-size: 21px; font-weight: 700; color: #fff;
    background: var(--ink); border: 0; border-radius: 14px;
  }
  .btn-primary:disabled { background: var(--rule); color: var(--ink-soft); }
  .btn-primary:active:not(:disabled) { opacity: .85; }

  .cancel-btn {
    margin-top: auto; min-height: 60px;
    font-size: 18px; font-weight: 600; color: var(--ink-soft);
    background: none; border: 2px solid var(--rule); border-radius: 14px;
  }
  .cancel-btn:active { background: var(--card); }

  /* ---------- success: the signature moment ----------
     A full-bleed flood in the item's own colour, legible from across the
     room so a member walking away knows it registered — and knows WHICH
     item registered, which is what catches a mis-tap. */
  #success {
    background: var(--flood, var(--ink));
    color: #fff;
    align-items: center; justify-content: center; gap: 10px;
    text-align: center;
  }
  .success-check {
    font-size: 56px; line-height: 1; margin-bottom: 4px;
  }
  .success-item {
    font-size: clamp(38px, 7vw, 76px); font-weight: 800;
    letter-spacing: -.03em; line-height: 1;
  }
  .success-who { font-size: clamp(18px, 2.4vw, 24px); font-weight: 600; opacity: .82; }

  @media (prefers-reduced-motion: no-preference) {
    #success.active .success-item,
    #success.active .success-check { animation: rise .22s cubic-bezier(.2,.7,.3,1) both; }
    #success.active .success-who { animation: rise .22s cubic-bezier(.2,.7,.3,1) .04s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }

  /* ---------- admin ---------- */
  #admin { gap: 16px; }
  .admin-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; border-bottom: 2px solid var(--rule);
  }
  .admin-head h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  #admin-batches { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #admin-batches h3 {
    font-size: 13px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px;
  }
  .batch {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 2px solid var(--rule);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
  }
  .batch-id { font-weight: 700; font-variant-numeric: tabular-nums; }
  .batch-meta { color: var(--ink-soft); font-size: 15px; }
  .pill {
    font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; color: #fff;
  }
  .pill.pending   { background: var(--plate-amber); }
  .pill.processed { background: var(--plate-green); }
  .batch .spacer { flex: 1; }
  .btn-sm {
    min-height: 48px; padding: 0 18px; font-size: 16px; font-weight: 700;
    border-radius: 12px; border: 2px solid var(--rule);
    background: var(--card); color: var(--ink);
  }
  .btn-sm.solid { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-danger {
    min-height: 52px; padding: 0 18px; font-size: 16px; font-weight: 700;
    border-radius: 12px; background: none;
    border: 2px solid var(--danger); color: var(--danger);
  }
  .admin-foot { display: flex; gap: 12px; align-items: center; }
  .warn-note {
    background: #FDECEA; border: 2px solid #F5C6C2; color: var(--danger);
    border-radius: 12px; padding: 12px 14px; font-weight: 600; margin-bottom: 12px;
  }
  .empty { color: var(--ink-soft); font-size: 17px; padding: 8px 2px; }

  /* The last-action line wraps onto its own row inside .batch (flex-wrap). */
  .batch-row-2 { flex-basis: 100%; display: flex; gap: 6px; align-items: center; }
  .batch-last { color: var(--ink-soft); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* On-screen batch report. A worker keying sales in reads this instead of
     needing a printer or the iOS pinch-to-PDF trick. */
  #batch-view {
    position: fixed; inset: 0; z-index: 20; background: var(--chalk);
    display: flex; flex-direction: column; padding: 20px 24px; gap: 12px;
  }
  #batch-view[hidden] { display: none; }
  .batch-view-head, .batch-view-foot { display: flex; align-items: center; gap: 12px; }
  .batch-view-head h2 { font-size: 22px; }
  .batch-view-head .spacer { flex: 1; }
  #batch-view-body {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    background: var(--card);
    border: 2px solid var(--rule); border-radius: 14px; padding: 16px 18px;
  }
  #batch-view-body h1 { font-size: 20px; margin-bottom: 2px; }
  #batch-view-body .sub { color: var(--ink-soft); font-size: 15px; margin-bottom: 14px; }
  #batch-view-body table { width: 100%; border-collapse: collapse; }
  #batch-view-body th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-soft); border-bottom: 2px solid var(--rule); padding: 8px 6px;
  }
  #batch-view-body td { padding: 11px 6px; border-bottom: 1px solid var(--rule); font-size: 16px; }
  #batch-view-body tr.member-start td { border-top: 2px solid var(--ink); }
  #batch-view-body .total-row td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 0; }

  /* ---------- print: the worker's sheet ---------- */
  @media print {
    body { background: #fff; color: #000; overflow: visible; }
    .screen, #reader, #admin, #idle, #locked, #success, #batch-view { display: none !important; }
    #print-container { display: block !important; padding: 0; }
    #print-container .brand-report { width: 1.8in; margin-bottom: 6pt; }
    #print-container h1 { font-size: 20pt; margin-bottom: 2pt; }
    #print-container .sub { font-size: 10pt; color: #444; margin-bottom: 12pt; }
    table { width: 100%; border-collapse: collapse; font-size: 11pt; }
    th { text-align: left; border-bottom: 2px solid #000; padding: 6pt 4pt; font-size: 9pt;
         text-transform: uppercase; letter-spacing: .08em; }
    td { border-bottom: 1px solid #ccc; padding: 6pt 4pt; }
    tr.member-start td { border-top: 2px solid #000; }
    .total-row td { font-weight: 700; border-top: 2px solid #000; border-bottom: 0; }
  }
</style>
</head>
<body>

<div id="idle" class="screen">
  <img class="brand" src="logo.png" width="520" height="183"
       alt="Iron Jungle Family Fitness">
  <h2 class="idle-title" id="idle-title">Scan your gym barcode</h2>
  <div class="scan-frame">
    <div id="reader"></div>
    <span></span><span></span><span></span><span></span>
  </div>
  <p class="hint">Card or phone &mdash; hold it steady</p>
  <button class="linkish" id="type-number-btn">No card? Type your member number</button>
  <p id="scanner-error" class="error" hidden></p>
</div>

<div id="typing" class="screen">
  <div class="typed-wrap">
    <h2 class="enroll-title">Type your member number</h2>
    <p class="hint" style="text-align:left">
      It&rsquo;s on the front of your card. Then type the name it&rsquo;s saved under &mdash;
      we check it, so nobody can bill your number.
    </p>
    <input type="text" id="typed-number" placeholder="Member number" maxlength="32"
           autocomplete="off" autocapitalize="characters" spellcheck="false">
    <input type="text" id="typed-name" placeholder="Your name" maxlength="40"
           autocomplete="off" autocapitalize="words" spellcheck="false">
    <p id="typed-error" class="error" hidden></p>
    <button class="btn-primary" id="typed-continue">Continue</button>
    <button class="cancel-btn" id="typed-cancel">Cancel</button>
  </div>
</div>

<div id="locked" class="screen">
  <div id="catalog-container"></div>
</div>

<div id="success" class="screen"></div>
<div id='admin' class='screen'>
  <div class="admin-head">
    <h2>Sales admin</h2>
    <button class="btn-sm" onclick='returnToIdle()'>Back to kiosk</button>
  </div>
  <div id='admin-batches'></div>
  <div class="admin-foot">
    <button class="btn-primary" id="create-batch-btn" onclick='doCreateBatch()'>Create batch</button>
    <span class="batch-meta" id="waiting-note"></span>
    <span class="spacer" style="flex:1"></span>
    <span class="batch-meta" id="admin-status"></span>
    <button class="btn-danger" onclick='doClearData()'>Clear all data</button>
  </div>
</div>
<div id="batch-view" hidden>
  <div class="batch-view-head">
    <h2 id="batch-view-title"></h2>
    <span class="spacer"></span>
    <button class="btn-sm" onclick='closeBatchView()'>Close</button>
  </div>
  <div id="batch-view-body"></div>
  <div class="batch-view-foot">
    <button class="btn-sm" id="batch-view-share" onclick='shareViewedBatch()'>Share</button>
    <button class="btn-sm" onclick='printViewedBatch()'>Print</button>
  </div>
</div>
<div id="print-container" style="display: none;"></div>

<script>
'use strict';

/* ============================================================
 * Task 3 — Product catalog
 *
 * Tab order on the purchase screen, first one opens by default. Energy leads
 * because the energy drinks fill most of the fridge, so the highest-traffic
 * item is one tap; anything in another category costs two.
 *
 * A group with no items has no tab, and if only one group has items the tab
 * row disappears entirely — so this works with a part-filled catalog.
 * ============================================================ */
const GROUPS = [
  { id: 'energy',         label: 'Energy' },
  { id: 'protein-drinks', label: 'Protein Drinks' },
  { id: 'hydration',      label: 'Water & Sports' },
  { id: 'food',           label: 'Bars & Snacks' }
];

/* ============================================================
 * Transcribed 2026-09-12 from the gym POS "Food and Drinks" screen. Names
 * match the POS tiles so the worker can search them when keying a batch.
 * Supplements are rung up at the desk and deliberately left out. Two rules:
 *
 *   - Prices are integer CENTS. $3.50 is 350, never 3.50.
 *   - `group` must be one of the GROUPS ids above. A typo throws on startup
 *     rather than quietly hiding the item where nobody can sell it.
 *
 * `id` and `sku` can be the same word; both must be unique across the whole
 * catalog. Keep each group's items together in this list — tile colours are
 * assigned by position, which is what stops two neighbours sharing a colour.
 * Within a group, items starred in the gym POS (its most-sold) come first.
 * ============================================================ */
const CATALOG = [
  // energy: POS favourites (yellow star) first, then the rest
  { group: "energy", id: "abe-all-black-everything-energy-drink", name: "ABE (All Black Everything) Energy Drink", sku: "abe-all-black-everything-energy-drink", price: 275 },
  { group: "energy", id: "alani-nu-carbonated", name: "Alani Nu Carbonated", sku: "alani-nu-carbonated", price: 275 },
  { group: "energy", id: "apesht-untamed-preworkout-drink", name: "Apesh*t Untamed Preworkout Drink", sku: "apesht-untamed-preworkout-drink", price: 350 },
  { group: "energy", id: "bang", name: "Bang", sku: "bang", price: 275 },
