<!DOCTYPE html>
<!-- html5-qrcode v2.3.8 — vendored from https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Iron Jungle — Counter Sales</title>
<script src="vendor/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen { display: none; height: 100vh; padding: 20px; }
  .screen.active { display: flex; flex-direction: column; }

  /* Product Catalog Grid — Task 3 */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
    padding: 16px 0;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }
  .product-btn {
    min-height: 88px;
    min-width: 88px;
    padding: 16px 12px;
    background: #222;
    border: 2px solid #444;
    border-radius: 12px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    text-align: center;
  }
  .product-btn:active {
    background: #333;
    border-color: #ff5500;
  }
  .product-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    border-color: #333;
  }
  .product-btn .price {
    font-size: 16px;
    font-weight: 400;
    color: #aaa;
  }

  .idle-title { text-align: center; padding: 12px 0; font-size: 22px; }
  #reader { width: 100%; max-width: 480px; margin: 0 auto; }
  .error { color: #ff6b6b; text-align: center; padding: 16px; font-size: 18px; }

  /* Quantity stepper — Task 6 */
  .qty-row {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; padding: 12px 0;
  }
  .qty-row button {
    min-width: 88px; min-height: 88px; font-size: 32px;
    background: #222; border: 2px solid #444; border-radius: 12px; color: #fff;
  }
  .qty-row button:disabled { opacity: 0.35; }
  #qty-value { font-size: 32px; min-width: 60px; text-align: center; }

  /* Cancel — must exist so an abandoned scan cannot wedge the kiosk */
  .cancel-btn {
    min-height: 60px; margin-top: auto; background: #2a1a1a;
    border: 2px solid #553333; border-radius: 12px; color: #ffaaaa; font-size: 18px;
  }

  /* Print Stylesheet — Task 7 */
  @media print {
    body { background: #fff; color: #000; overflow: visible; }
    .screen, #reader, #admin, #idle, #locked, #success { display: none; }
    #print-container { display: block; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  }
</style>
</head>
<body>

<div id="idle" class="screen">
  <h2 class="idle-title">Scan your gym barcode</h2>
  <div id="reader"></div>
  <p id="scanner-error" class="error" hidden></p>
</div>

<div id="locked" class="screen">
  <div id="catalog-container"></div>
</div>

<div id="success" class="screen"></div>
<div id="admin" class="screen"></div>
<div id="print-container" style="display: none;"></div>

<script>
'use strict';

/* ============================================================
 * Task 3 — Product catalog
 *
 * FILL IN: The catalog below contains placeholder items and prices.
 * Replace with the real fridge and shelf contents when known.
 * Prices are integer cents ($3.50 = 350).
 * ============================================================ */
const CATALOG = [
  { id: 'water',         name: 'Bottled Water',      sku: 'water',         price: 150 },
  { id: 'gatorade',      name: 'Gatorade',           sku: 'gatorade',      price: 250 },
  { id: 'protein-bar',   name: 'Protein Bar',        sku: 'protein-bar',   price: 300 },
  { id: 'energy-drink',  name: 'Energy Drink',       sku: 'energy-drink',  price: 350 },
  { id: 'pre-workout',   name: 'Pre-Workout Scoop',  sku: 'pre-workout',   price: 200 },
  { id: 'protein-shake', name: 'RTD Protein Shake',  sku: 'protein-shake', price: 450 },
  { id: 'shaker-cup',    name: 'Shaker Bottle',      sku: 'shaker-cup',    price: 800 },
  { id: 'lifting-straps',name: 'Lifting Straps',     sku: 'lifting-straps',price: 1200 }
];

/**
 * Validate catalog integrity. Throws loudly on duplicate id, duplicate sku,
 * missing or empty name, or invalid price.
 */
function validateCatalog(catalog) {
  if (!Array.isArray(catalog) || catalog.length === 0) {
    throw new Error('Catalog must be a non-empty array');
  }
  const ids = new Set();
  const skus = new Set();
  for (const item of catalog) {
    if (!item.id || typeof item.id !== 'string') {
      throw new Error(`Catalog item missing valid id: ${JSON.stringify(item)}`);
    }
    if (ids.has(item.id)) {
      throw new Error(`Duplicate catalog id: "${item.id}"`);
    }
    ids.add(item.id);

    if (!item.sku || typeof item.sku !== 'string') {
      throw new Error(`Catalog item "${item.id}" missing valid sku`);
    }
    if (skus.has(item.sku)) {
      throw new Error(`Duplicate catalog sku: "${item.sku}"`);
    }
    skus.add(item.sku);

    if (!item.name || typeof item.name !== 'string' || item.name.trim() === '') {
      throw new Error(`Catalog item "${item.id}" has empty or missing name`);
    }

    if (typeof item.price !== 'number' || !Number.isInteger(item.price) || item.price < 0) {
      throw new Error(`Catalog item "${item.id}" has invalid price (must be non-negative integer cents): ${item.price}`);
    }
  }
  return true;
}

// Startup validation — fail fast if catalog is broken
validateCatalog(CATALOG);

function formatPrice(cents) {
  return '$' + (cents / 100).toFixed(2);
}

/**
 * Render product grid into a target element.
 */
function renderProductGrid(container, catalog, onItemClick) {
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'product-grid';
  for (const item of catalog) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'product-btn';
    btn.dataset.productId = item.id;
    btn.disabled = true; // disabled by default until state machine locks

    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = item.name;

    const priceSpan = document.createElement('span');
    priceSpan.className = 'price';
    priceSpan.textContent = formatPrice(item.price);

    btn.appendChild(nameSpan);
    btn.appendChild(priceSpan);

    if (onItemClick) {
      btn.addEventListener('click', () => onItemClick(item));
    }
    grid.appendChild(btn);
  }
  container.appendChild(grid);
}

/* ============================================================
 * Storage layer (Task 2)
 * ============================================================ */

const STORAGE_KEY = 'ij.v1';

function defaultState() {
  return {
    schema: 1,
    members: {},
    sales: [],
    batches: []
  };
}

let corrupted = false;

function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    return defaultState();
  }
  if (!raw) return defaultState();

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    quarantine(STORAGE_KEY);
    corrupted = true;
    return defaultState();
  }

  if (!parsed || parsed.schema !== 1) {
    quarantine(STORAGE_KEY);
    corrupted = true;
    return defaultState();
  }

  const state = defaultState();
  state.members = parsed.members && typeof parsed.members === 'object' ? parsed.members : {};
  state.sales = Array.isArray(parsed.sales) ? parsed.sales : [];
  state.batches = Array.isArray(parsed.batches) ? parsed.batches : [];
  return state;
}

function quarantine(key) {
  try {
    const raw = localStorage.getItem(key);
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const badKey = key + '.corrupt.' + stamp;
    if (raw !== null) localStorage.setItem(badKey, raw);
    localStorage.removeItem(key);
  } catch (e) {}
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    return false;
  }
}

function addSale(sale) {
  const state = loadState();
  state.sales.push(sale);
  return saveState(state);
}

/* ============================================================
 * Task 4 — Scanner state machine
 * ============================================================ */
// State machine: idle -> locked -> recording -> success -> idle
let state = 'idle';
let currentBadgeId = null;
let scannerInstance = null;
let currentQty = 1;
// Timestamp before which scans are ignored. A badge left sitting in frame
// re-decodes continuously, so a plain "pause the camera" is not enough on its own.
let scanLockoutUntil = 0;

// Lockout duration for secondary guard (ms)
const LOCKOUT_MS = 3000;
const MAX_QTY = 10;

/**
 * Enters idle state and starts the camera.
 */
function enterIdle() {
  state = 'idle';
  currentBadgeId = null;
  showScreen('idle');
  // First entry creates and starts the scanner; every later entry resumes the
  // paused one. startScanner() early-returns when an instance exists, so
  // calling only that left the camera paused forever after the first sale.
  if (scannerInstance) resumeScanner(); else startScanner();
}

/**
 * Enters locked state: pauses camera and shows item grid.
 */
function enterLocked(badgeId) {
  if (state !== 'idle') return; // ignore if not idle
  state = 'locked';
  currentBadgeId = badgeId;
  currentQty = 1;
  pauseScanner();
  showScreen('locked');
  updateLockedScreen();
}

/**
 * Enters recording state: disables all product buttons synchronously.
 */
function enterRecording() {
  if (state !== 'locked') return;
  state = 'recording';
  // Sync disable of product buttons
  const productButtons = document.querySelectorAll('.product-btn');
  productButtons.forEach(btn => btn.disabled = true);
  showScreen('locked'); // remain on locked screen
}

/**
 * Enters success state: shows confirmation for 2s then returns to idle.
 */
function enterSuccess(sale) {
  if (state !== 'recording') return;
  state = 'success';
  document.getElementById('success').innerHTML = `
    <h2>Thanks, ${escapeHtml(sale.memberName)}</h2>
    <p>${escapeHtml(sale.productName)} &times; ${sale.qty}</p>
  `;
  showScreen('success');
  setTimeout(() => {
    // Clear the name off the screen before the next member walks up.
    document.getElementById('success').innerHTML = '';
    armScanLockout();
    enterIdle();
  }, 2000);
}

/**
 * Returns to idle from any state (e.g., cancel).
 */
function returnToIdle() {
  armScanLockout();
  enterIdle();
}

/**
 * Secondary guard: ignore scans for LOCKOUT_MS after leaving a purchase, so a
 * badge still sitting in front of the camera cannot instantly start another one.
 */
function armScanLockout() {
  scanLockoutUntil = Date.now() + LOCKOUT_MS;
}

/* ============================================================
 * UI / Screen management
 * ============================================================ */
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

/**
 * Trim, collapse internal whitespace, enforce length. Returns null if invalid.
 */
function sanitizeName(raw) {
  if (typeof raw !== 'string') return null;
  const trimmed = raw.trim().replace(/\s+/g, ' ');
  if (trimmed.length === 0 || trimmed.length > 40) return null;
  return trimmed;
}

/**
 * Bind (or rebind) the current badge to a name. Returns true on success.
 * Past sales keep their own memberName snapshot and are untouched.
 */
function enrollCurrentBadge(name) {
  const clean = sanitizeName(name);
  if (!clean) return false;
  const s = loadState();
  s.members[currentBadgeId] = { name: clean, enrolledAt: new Date().toISOString() };
  return saveState(s);
}

function updateLockedScreen(forceEnroll) {
  const locked = document.getElementById('locked');
  const member = forceEnroll ? null : loadState().members[currentBadgeId];

  if (member) {
    locked.innerHTML = `
      <h2>Hello, ${escapeHtml(member.name)}</h2>
      <button id="not-me-btn">Not ${escapeHtml(member.name)}?</button>
      <div class="qty-row">
        <button id="qty-minus">&minus;</button>
        <span id="qty-value">1</span>
        <button id="qty-plus">+</button>
      </div>
      <div id="catalog-container"></div>
      <button class="cancel-btn" id="cancel-btn">Cancel</button>
    `;
    // Re-prompt for a name instead of just bouncing to idle — the old code
    // deleted from a throwaway loadState() copy, so the bad name never cleared.
    document.getElementById('not-me-btn').addEventListener('click', () => {
      updateLockedScreen(true);
    });
    wireQtyStepper();
    wireCancel();
    renderProductGrid(document.getElementById('catalog-container'), CATALOG, onProductTap);
  } else {
    locked.innerHTML = `
      <h2>Welcome — what's your name?</h2>
      <input type="text" id="name-input" placeholder="Your name" maxlength="40" autocomplete="off">
      <button id="enroll-btn" disabled>Save</button>
      <button class="cancel-btn" id="cancel-btn">Cancel</button>
    `;
    const nameInput = document.getElementById('name-input');
    const enrollBtn = document.getElementById('enroll-btn');

    nameInput.addEventListener('input', () => {
      enrollBtn.disabled = sanitizeName(nameInput.value) === null;
    });
    enrollBtn.addEventListener('click', () => {
      if (!enrollCurrentBadge(nameInput.value)) {
        showFatal('Could not save. Tell the front desk.');
        return;
      }
      // Re-render into the greeting + item grid for the member we just enrolled.
      updateLockedScreen();
    });
    wireCancel();
    nameInput.focus();
  }
}

function wireCancel() {
  const btn = document.getElementById('cancel-btn');
  if (btn) btn.addEventListener('click', returnToIdle);
}

function wireQtyStepper() {
  const valueEl = document.getElementById('qty-value');
  const minus = document.getElementById('qty-minus');
  const plus = document.getElementById('qty-plus');
  const render = () => {
    valueEl.textContent = String(currentQty);
    minus.disabled = currentQty <= 1;
    plus.disabled = currentQty >= MAX_QTY;
  };
  minus.addEventListener('click', () => { if (currentQty > 1) currentQty--; render(); });
  plus.addEventListener('click', () => { if (currentQty < MAX_QTY) currentQty++; render(); });
  render();
}

function onProductTap(product) {
  // enterRecording() disables every product button synchronously, in this same
  // handler, so a double-tap on a lagging button cannot produce two sales.
  if (state !== 'locked') return;
  enterRecording();
  recordSale(product);
}

/**
 * HTML escape helper to prevent XSS.
 */
function escapeHtml(text) {
  // Previous version mapped each character to itself, so it escaped nothing.
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

/**
 * Unrecoverable-for-the-member error. Returns the kiosk to a usable state
 * rather than leaving it wedged mid-purchase.
 */
function showFatal(message) {
  alert(message);
  returnToIdle();
}

/* ============================================================
 * Task 6 — Sale capture
 * ============================================================ */
function recordSale(product) {
  if (state !== 'recording') return;
  
  // Build sale with snapshots
  const member = loadState().members[currentBadgeId];
  const sale = {
    id: crypto.randomUUID(),
    badgeId: currentBadgeId,
    memberName: member ? member.name : 'Unknown',
    productId: product.id,
    productName: product.name,   // snapshot
    sku: product.sku,            // snapshot
    price: product.price,        // snapshot (cents)
    qty: currentQty,
    at: new Date().toISOString(),
    batchId: null
  };
  
  // A failed write must never reach the success screen.
  if (addSale(sale)) {
    enterSuccess(sale);
  } else {
    // Go back to 'locked' and re-enable the grid so the member can retry.
    // Previously this left state='recording' with every button disabled,
    // wedging the kiosk until someone reloaded it.
    alert('Could not save that sale. Please tap the item again.');
    state = 'locked';
    updateLockedScreen();
  }
}

/* ============================================================
 * Task 7 — Export batches
 * ============================================================ */
function createBatch() {
  const state = loadState();
  const pendingSales = state.sales.filter(s => s.batchId === null);
  if (pendingSales.length === 0) return null;

  const batchId = crypto.randomUUID();
  pendingSales.forEach(s => { s.batchId = batchId; });
  
  const batch = {
    id: batchId,
    createdAt: new Date().toISOString(),
    saleIds: pendingSales.map(s => s.id),
    status: 'pending',
    processedAt: null
  };
  state.batches.push(batch);
  if (saveState(state)) return batch;
  return null;
}

function printBatch(batchId) {
  const state = loadState();
  const batch = state.batches.find(b => b.id === batchId);
  if (!batch) return;

  const batchSales = state.sales.filter(s => s.batchId === batchId);
  const grouped = batchSales.reduce((acc, s) => {
    if (!acc[s.memberName]) acc[s.memberName] = [];
    acc[s.memberName].push(s);
    return acc;
  }, {});

  const members = Object.keys(grouped).sort();
  
  const container = document.getElementById('print-container');
  container.innerHTML = `
    <h2>Batch: ${batchId}</h2>
    <p>Created: ${batch.createdAt}</p>
    <table>
      <thead>
        <tr><th>Member</th><th>Item</th><th>Qty</th><th>Price</th><th>Time</th></tr>
      </thead>
      <tbody>
        ${members.map(m => grouped[m].map((s, i) => `
          <tr>
            <td>${i === 0 ? escapeHtml(m) : ''}</td>
            <td>${escapeHtml(s.productName)}</td>
            <td>${s.qty}</td>
            <td>${formatPrice(s.price * s.qty)}</td>
            <td>${s.at}</td>
          </tr>
        `).join('')).join('')}
      </tbody>
    </table>
  `;
  window.print();
}

function confirmBatch(batchId) {
  const state = loadState();
  const batch = state.batches.find(b => b.id === batchId);
  if (!batch) return false;
  batch.status = 'processed';
  batch.processedAt = new Date().toISOString();
  return saveState(state);
}

/* ============================================================
 * Scanner Integration (Task 1 + 4)
 * ============================================================ */
function startScanner() {
  if (scannerInstance) return;
  try {
    scannerInstance = new Html5Qrcode("reader");
  } catch (e) {
    // Thrown synchronously when the #reader element is missing.
    console.error('Failed to construct scanner:', e);
    showScannerError('Scanner failed to load. Tell the front desk.');
    return;
  }
  // start() is async — a denied or missing camera rejects the promise and is
  // NOT catchable by a try/catch around this call.
  scannerInstance.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess,
    onScanError
  ).catch(e => {
    console.error('Failed to start camera:', e);
    showScannerError('Camera unavailable. Check camera permission in Settings, then reload.');
  });
}

function pauseScanner() {
  try {
    if (scannerInstance) scannerInstance.pause(true);
  } catch (e) {
    console.warn('pause failed:', e);
  }
}

function resumeScanner() {
  try {
    if (scannerInstance) scannerInstance.resume();
  } catch (e) {
    // Resuming a scanner that is already scanning throws; harmless.
    console.warn('resume failed:', e);
  }
}

function onScanSuccess(decodedText) {
  // Primary guard: only accept scans from idle state
  if (state !== 'idle') return;
  // Secondary guard: a badge left sitting in frame must not immediately
  // re-trigger when the camera resumes after the previous sale.
  if (Date.now() < scanLockoutUntil) return;

  // Pause camera immediately (primary fix)
  pauseScanner();

  // Store badge ID and enter locked state
  currentBadgeId = decodedText.trim();
  enterLocked(currentBadgeId);
}

function onScanError(error) {
  // Ignore scan errors; we just want to keep scanning
  console.warn('Scan error:', error);
}

function showScannerError(message) {
  // Write into a dedicated node — replacing the whole idle screen would
  // destroy #reader, which the scanner needs to mount into.
  const el = document.getElementById('scanner-error');
  el.textContent = message;
  el.hidden = false;
}

/* ============================================================
 * Task 2 & 3 — demo() self-checks (updated for state machine)
 * ============================================================ */
function demoStorage() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  localStorage.clear();
  const s1 = loadState();
  assert(s1.schema === 1 && Array.isArray(s1.sales) && Array.isArray(s1.batches), 'default shape has schema=1');

  const sale = {
    id: 's-test-1', badgeId: 'B1', memberName: 'Jane D.',
    productId: 'water', productName: 'Water', sku: 'water',
    price: 200, qty: 1, at: new Date().toISOString(), batchId: null
  };
  assert(addSale(sale) === true, 'addSale returns true');
  assert(loadState().sales.length === 1, 'sale round-trips');

  const origSet = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function () { throw new Error('QuotaExceededError'); };
  assert(addSale(Object.assign({}, sale, { id: 's-test-2' })) === false, 'addSale returns false when setItem throws');
  localStorage.setItem = origSet;
  assert(loadState().sales.length === 1, 'failed addSale does not persist');

  localStorage.setItem(STORAGE_KEY, '{not valid json!!');
  const s4 = loadState();
  assert(corrupted === true, 'corrupted flag set after garbage write');
  assert(s4.sales.length === 0, 'loadState quarantines');

  return results;
}

function demoCatalog() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  assert(validateCatalog(CATALOG) === true, 'default CATALOG is valid');

  let dupSkuThrew = false;
  try {
    validateCatalog([
      { id: 'a', name: 'A', sku: 'DUP', price: 100 },
      { id: 'b', name: 'B', sku: 'DUP', price: 200 }
    ]);
  } catch (e) {
    dupSkuThrew = true;
  }
  assert(dupSkuThrew, 'duplicate SKU throws at startup');

  let dupIdThrew = false;
  try {
    validateCatalog([
      { id: 'DUP', name: 'A', sku: 'a', price: 100 },
      { id: 'DUP', name: 'B', sku: 'b', price: 200 }
    ]);
  } catch (e) {
    dupIdThrew = true;
  }
  assert(dupIdThrew, 'duplicate id throws at startup');

  let emptyNameThrew = false;
  try {
    validateCatalog([{ id: 'a', name: '   ', sku: 'a', price: 100 }]);
  } catch (e) {
    emptyNameThrew = true;
  }
  assert(emptyNameThrew, 'empty name throws at startup');

  return results;
}

/* ============================================================
 * Task 4 — State machine self-check
 * ============================================================ */
function demoScanner() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  // Reset state
  state = 'idle';
  currentBadgeId = null;
  scanLockoutUntil = 0;

  // Mock scanner functions
  let paused = false;
  const mockPause = () => { paused = true; };
  const mockResume = () => { paused = false; };
  
  // Temporarily replace scanner functions
  const originalPause = pauseScanner;
  const originalResume = resumeScanner;
  const originalInstance = scannerInstance;
