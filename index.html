/** Items in one group, in catalog order. */
function itemsInGroup(groupId) {
  return CATALOG.filter(item => (item.group || GROUPS[0].id) === groupId);
}

/** Only the groups that actually have something to sell. */
function nonEmptyGroups() {
  return GROUPS.filter(g => itemsInGroup(g.id).length > 0);
}

/**
 * Validate catalog integrity. Throws loudly on duplicate id, duplicate sku,
 * missing or empty name, or invalid price.
 */
function validateCatalog(catalog) {
  if (!Array.isArray(catalog) || catalog.length === 0) {
    throw new Error('Catalog must be a non-empty array');
  }
  const ids = new Set();
  const skus = new Set();
  for (const item of catalog) {
    if (!item.id || typeof item.id !== 'string') {
      throw new Error(`Catalog item missing valid id: ${JSON.stringify(item)}`);
    }
    if (ids.has(item.id)) {
      throw new Error(`Duplicate catalog id: "${item.id}"`);
    }
    ids.add(item.id);

    if (!item.sku || typeof item.sku !== 'string') {
      throw new Error(`Catalog item "${item.id}" missing valid sku`);
    }
    if (skus.has(item.sku)) {
      throw new Error(`Duplicate catalog sku: "${item.sku}"`);
    }
    skus.add(item.sku);

    if (!item.name || typeof item.name !== 'string' || item.name.trim() === '') {
      throw new Error(`Catalog item "${item.id}" has empty or missing name`);
    }

    if (typeof item.price !== 'number' || !Number.isInteger(item.price) || item.price < 0) {
      throw new Error(`Catalog item "${item.id}" has invalid price (must be non-negative integer cents): ${item.price}`);
    }

    // `group` is optional — an item without one falls into the first group so
    // an ungrouped catalog still works. But a group that does not exist is a
    // typo, and a typo'd item renders under no tab at all: invisible, and
    // therefore unsellable, with nothing to notice it by. Fail at startup.
    if (item.group !== undefined) {
      if (typeof item.group !== 'string' || !GROUPS.some(g => g.id === item.group)) {
        throw new Error(`Catalog item "${item.id}" has unknown group "${item.group}" ` +
          `(expected one of: ${GROUPS.map(g => g.id).join(', ')})`);
      }
    }
  }
  return true;
}

// Startup validation — fail fast if catalog is broken
validateCatalog(CATALOG);

function formatPrice(cents) {
  return '$' + (cents / 100).toFixed(2);
}

/* Plate colours, borrowed from competition weight plates where colour IS the
   weight. Derived from the item id so it is stable for the life of the item —
   a regular learns "Gatorade is the blue one" and stops reading labels. Adding
   a catalog item needs no colour decision. */
const PLATE_VARS = ['--plate-red', '--plate-blue', '--plate-amber',
                    '--plate-green', '--plate-violet', '--plate-teal'];

function plateVar(id) {
  // By catalog position, so neighbouring tiles never share a colour — two
  // green tiles side by side defeats the whole point of colour-as-identity.
  // Falls back to a hash for items no longer in the catalog, so an old sale
  // still resolves to a stable colour on a reprint.
  const i = CATALOG.findIndex(item => item.id === id);
  if (i !== -1) return PLATE_VARS[i % PLATE_VARS.length];
  let h = 0;
  for (let k = 0; k < id.length; k++) h = (h * 31 + id.charCodeAt(k)) >>> 0;
  return PLATE_VARS[h % PLATE_VARS.length];
}

/**
 * Which category tab is open. Reset per member so the next person in line
 * always starts on the first tab rather than inheriting where the last one browsed.
 */
let activeGroup = null;

/**
 * Render the category tabs and the grid for the open tab.
 *
 * 15-25 drinks plus meal preps plus a supplement shelf is well past what one
 * flat grid can show, and a single long scroll would cost the best-selling
 * category a scroll instead of a tap. Tabs keep drinks at one tap.
 */
function renderCatalog(tabsEl, gridEl, onItemClick) {
  const groups = nonEmptyGroups();
  if (groups.length === 0) { gridEl.innerHTML = ''; return; }

  // A tab that is open but no longer has items (catalog edited between
  // members) must not leave a blank grid.
  if (!groups.some(g => g.id === activeGroup)) activeGroup = groups[0].id;

  tabsEl.innerHTML = '';
  // One category needs no tabs — nothing to switch to.
  tabsEl.hidden = groups.length < 2;
  if (groups.length > 1) {
    for (const g of groups) {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'cat-tab' + (g.id === activeGroup ? ' active' : '');
      tab.dataset.groupId = g.id;
      tab.textContent = g.label;
      tab.setAttribute('aria-pressed', g.id === activeGroup ? 'true' : 'false');
      tab.addEventListener('click', () => {
        if (activeGroup === g.id) return;
        activeGroup = g.id;
        renderCatalog(tabsEl, gridEl, onItemClick);
        // Back to the top; the previous tab may have been scrolled down.
        gridEl.scrollTop = 0;
      });
      tabsEl.appendChild(tab);
    }
  }

  renderProductGrid(gridEl, itemsInGroup(activeGroup), onItemClick);
}

/**
 * Render product grid into a target element.
 */
function renderProductGrid(container, catalog, onItemClick) {
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'product-grid';
  for (const item of catalog) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'product-btn';
    btn.dataset.productId = item.id;
    btn.style.setProperty('--plate', 'var(' + plateVar(item.id) + ')');
    // Enabled only while a member is locked in. The grid is rendered from
    // updateLockedScreen(), so this is normally true — but it must be derived
    // from state, never hardcoded: hardcoding `true` here left the buttons
    // permanently dead, because nothing ever set them back to false.
    btn.disabled = state !== 'locked';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = item.name;

    const priceSpan = document.createElement('span');
    priceSpan.className = 'price';
    priceSpan.textContent = formatPrice(item.price);

    btn.appendChild(nameSpan);
    btn.appendChild(priceSpan);

    if (onItemClick) {
      btn.addEventListener('click', () => onItemClick(item));
    }
    grid.appendChild(btn);
  }
  container.appendChild(grid);
}

/* ============================================================
 * Storage layer (Task 2)
 * ============================================================ */

const STORAGE_KEY = 'ij.v1';

function defaultState() {
  return {
    schema: 1,
    members: {},
    sales: [],
    batches: []
  };
}

let corrupted = false;

function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    return defaultState();
  }
  if (!raw) return defaultState();

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    quarantine(STORAGE_KEY);
    corrupted = true;
    return defaultState();
  }

  if (!parsed || parsed.schema !== 1) {
    quarantine(STORAGE_KEY);
    corrupted = true;
    return defaultState();
  }

  const state = defaultState();
  state.members = parsed.members && typeof parsed.members === 'object' ? parsed.members : {};
  state.sales = Array.isArray(parsed.sales) ? parsed.sales : [];
  state.batches = Array.isArray(parsed.batches) ? parsed.batches : [];
  return state;
}

function quarantine(key) {
  try {
    const raw = localStorage.getItem(key);
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const badKey = key + '.corrupt.' + stamp;
    if (raw !== null) localStorage.setItem(badKey, raw);
    localStorage.removeItem(key);
  } catch (e) {}
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    return false;
  }
}

function addSale(sale) {
  const state = loadState();
  state.sales.push(sale);
  return saveState(state);
}

/* ============================================================
 * Task 4 — Scanner state machine
 * ============================================================ */
// State machine: idle -> locked -> recording -> success -> idle
let state = 'idle';
let currentBadgeId = null;
let scannerInstance = null;
let currentQty = 1;
// How the member in front of the kiosk proved who they were: a scanned card, or
// a typed member number (item 4). Every sale carries it, so the report can flag
// a typed line for the desk to check. A sale with no `entry` is a scan — that is
// every sale written before this existed, and it is the honest default.
let entryMode = 'scan';
// Timestamp before which scans are ignored. A badge left sitting in frame
// re-decodes continuously, so a plain "pause the camera" is not enough on its own.
let scanLockoutUntil = 0;

// Lockout duration for secondary guard (ms)
const LOCKOUT_MS = 3000;
/**
 * Shape of a real gym keytag, e.g. "IJG18399". Code 39 carries no check digit,
 * so a partial or smudged read can decode to a plausible-but-wrong ID — and a
 * wrong ID that happens to match another member bills that member. Anything
 * that doesn't look like a card is ignored, exactly as if it never decoded.
 * CALIBRATION KNOB: loosen this if the gym issues a different card format.
 */
const BADGE_RE = /^[A-Z0-9][A-Z0-9-]{3,31}$/;

/**
 * Normalize a decoded barcode to a badge ID, or return null if it isn't one.
 * Code 39 is uppercase-only and some readers include the `*` start/stop
 * delimiters, so strip those before matching.
 */
function normalizeBadgeId(decodedText) {
  if (typeof decodedText !== 'string') return null;
  const clean = decodedText.trim().toUpperCase().replace(/^\*+|\*+$/g, '');
  return BADGE_RE.test(clean) ? clean : null;
}
const MAX_QTY = 10;

/**
 * Enters idle state and starts the camera.
 */
function enterIdle() {
  state = 'idle';
  currentBadgeId = null;
  // The next member starts as a scan unless they say otherwise.
  entryMode = 'scan';
  showScreen('idle');
  // First entry creates and starts the scanner; every later entry resumes the
  // paused one. startScanner() early-returns when an instance exists, so
  // calling only that left the camera paused forever after the first sale.
  if (scannerInstance) resumeScanner(); else startScanner();
  armInactivityTimer();
}

/**
 * Enters locked state: pauses camera and shows item grid.
 */
function enterLocked(badgeId) {
  if (state !== 'idle') return; // ignore if not idle
  state = 'locked';
  currentBadgeId = badgeId;
  currentQty = 1;
  // Next member in line starts on the first tab, not wherever the last one browsed.
  activeGroup = null;
  pauseScanner();
  showScreen('locked');
  updateLockedScreen();
  armInactivityTimer();
}

/**
 * The member in front of the kiosk is now identified: hand them the item grid.
 * Both entry paths end here — a scan (already idle) and a typed number (typing).
 * enterLocked() only accepts `idle`, so the typed path hands the state over
 * explicitly rather than duplicating the lock-in.
 */
function lockInMember(badgeId, mode) {
  entryMode = mode;
  if (state !== 'idle') state = 'idle';
  enterLocked(badgeId);
}

/**
 * Enters recording state: disables all product buttons synchronously.
 */
function enterRecording() {
  if (state !== 'locked') return;
  state = 'recording';
  // Sync disable of product buttons
  const productButtons = document.querySelectorAll('.product-btn');
  productButtons.forEach(btn => btn.disabled = true);
  showScreen('locked'); // remain on locked screen
  armInactivityTimer();
}

/**
 * Enters success state: shows confirmation for 2s then returns to idle.
 */
function enterSuccess(sale) {
  if (state !== 'recording') return;
  state = 'success';
  // Flood the screen in the item's own plate colour — readable from across
  // the room, and it names the item so a mis-tap is caught immediately.
  const scr = document.getElementById('success');
  scr.style.setProperty('--flood', 'var(' + plateVar(sale.productId) + ')');
  scr.innerHTML = `
    <div class="success-check" aria-hidden="true">&check;</div>
    <div class="success-item">${escapeHtml(sale.productName)}${sale.qty > 1 ? ' &times; ' + sale.qty : ''}</div>
    <div class="success-who">Charged to ${escapeHtml(sale.memberName)}</div>
  `;
  showScreen('success');
  armInactivityTimer();
  setTimeout(() => {
    // Clear the name off the screen before the next member walks up.
    document.getElementById('success').innerHTML = '';
    armScanLockout();
    enterIdle();
  }, 2000);
}

/**
 * Returns to idle from any state (e.g., cancel).
 */
function returnToIdle() {
  armScanLockout();
  enterIdle();
}

/**
 * Secondary guard: ignore scans for LOCKOUT_MS after leaving a purchase, so a
 * badge still sitting in front of the camera cannot instantly start another one.
 */
function armScanLockout() {
  scanLockoutUntil = Date.now() + LOCKOUT_MS;
}

/* ============================================================
 * Item 1 — kiosk inactivity timeout
 *
 * A member who scans and walks away used to leave the kiosk sitting on THEIR
 * grid with the camera paused, so the next person's tap billed the first
 * member. The screens that are waiting for a person — locked, the enrollment
 * form, typed entry — now fall back to idle after 45 s without a touch, and
 * admin after 3 min. `recording` and `success` are never interrupted: neither
 * is a dead end, and both end by themselves.
 * ============================================================ */
const KIOSK_IDLE_MS = 45 * 1000;
const ADMIN_IDLE_MS = 180 * 1000;
let inactivityTimer = null;

/** How long the state we are in now may sit untouched. 0 means "no timeout". */
function inactivityTimeoutMs() {
  if (state === 'admin') return ADMIN_IDLE_MS;
  if (state === 'locked' || state === 'typing') return KIOSK_IDLE_MS;
  return 0;
}

/**
 * (Re)start the countdown for the current state. Called on every state change
 * and on every touch or keystroke, so any activity pushes the deadline out.
 */
function armInactivityTimer() {
  if (inactivityTimer !== null) {
    clearTimeout(inactivityTimer);
    inactivityTimer = null;
  }
  const ms = inactivityTimeoutMs();
  if (ms > 0) inactivityTimer = setTimeout(onInactivityTimeout, ms);
}

function onInactivityTimeout() {
  inactivityTimer = null;
  // A sale in flight or a receipt being read is not an abandoned screen.
  if (state === 'recording' || state === 'success' || state === 'idle') return;
  returnToIdle();
}

// Capture phase, so a handler that stops propagation cannot hide the fact that
// somebody is still standing there. mousedown is for smoke-testing on a laptop;
// the counter itself only ever produces touchstart/input.
['touchstart', 'input', 'mousedown'].forEach((type) => {
  document.addEventListener(type, armInactivityTimer, { passive: true, capture: true });
});

/* ============================================================
 * UI / Screen management
 * ============================================================ */
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

/**
 * Trim, collapse internal whitespace, enforce length. Returns null if invalid.
 */
function sanitizeName(raw) {
  if (typeof raw !== 'string') return null;
  const trimmed = raw.trim().replace(/\s+/g, ' ');
  if (trimmed.length === 0 || trimmed.length > 40) return null;
  return trimmed;
}

/**
 * Bind (or rebind) the current badge to a name. Returns true on success.
 * Past sales keep their own memberName snapshot and are untouched.
 */
function enrollCurrentBadge(name) {
  const clean = sanitizeName(name);
  if (!clean) return false;
  const s = loadState();
  s.members[currentBadgeId] = { name: clean, enrolledAt: new Date().toISOString() };
  return saveState(s);
}

function updateLockedScreen(forceEnroll) {
  const locked = document.getElementById('locked');
  const existing = loadState().members[currentBadgeId];
  const member = forceEnroll ? null : existing;

  if (member) {
    locked.innerHTML = `
      <div class="member-bar">
        <span class="member-name">Hi, ${escapeHtml(member.name)}</span>
        <button class="linkish" id="not-me-btn">Not you?</button>
      </div>
      <div class="qty-row">
        <span class="qty-label">Qty</span>
        <button id="qty-minus" data-rapid aria-label="One fewer">&minus;</button>
        <span id="qty-value">1</span>
        <button id="qty-plus" data-rapid aria-label="One more">+</button>
      </div>
      <div id="cat-tabs"></div>
      <div id="catalog-container"></div>
      <button class="cancel-btn" id="cancel-btn">Cancel</button>
    `;
    // Re-prompt for a name instead of just bouncing to idle — the old code
    // deleted from a throwaway loadState() copy, so the bad name never cleared.
    document.getElementById('not-me-btn').addEventListener('click', () => {
      // A typed number is not a card: there is nothing to re-bind, and letting
      // someone rename a member here would undo the name check that is the
      // whole point of the typed path. Send them back to what they typed.
      if (entryMode === 'typed') { returnToTyping(); return; }
      updateLockedScreen(true);
    });
    wireQtyStepper();
    wireCancel();
    renderCatalog(document.getElementById('cat-tabs'),
                  document.getElementById('catalog-container'), onProductTap);
  } else {
    // forceEnroll on a card we already know is a REBIND, not a first
    // enrollment. Showing "First time — we only ask once" to someone whose card
    // is already saved is a lie, and a member who taps "Not you?" by mistake
    // needs an obvious way back that does not overwrite whoever owns the card.
    const rebind = !!existing;
    locked.innerHTML = `
      <div class="enroll-wrap">
        <h2 class="enroll-title">${rebind
          ? 'Whose card is this?'
          : 'First time &mdash; what&rsquo;s your name?'}</h2>
        <p class="hint" style="text-align:left">${rebind
          ? 'Saved as ' + escapeHtml(existing.name) + '. A new name replaces that for future sales; past sales keep the name they were rung up under.'
          : 'We only ask once. Next time your badge just works.'}</p>
        <input type="text" id="name-input" placeholder="Your name" maxlength="40"
               autocomplete="off" autocapitalize="words" spellcheck="false">
        <button class="btn-primary" id="enroll-btn" disabled>Save my name</button>
        ${rebind
          ? '<button class="linkish" id="its-me-btn">No, I&rsquo;m ' + escapeHtml(existing.name) + '</button>'
          : ''}
      </div>
      <button class="cancel-btn" id="cancel-btn">Cancel</button>
    `;
    if (rebind) {
      // Straight back to the greeting. Nothing was written, so a mis-tap costs
      // one more tap instead of somebody's identity.
      document.getElementById('its-me-btn')
        .addEventListener('click', () => updateLockedScreen());
    }
    const nameInput = document.getElementById('name-input');
    const enrollBtn = document.getElementById('enroll-btn');

    nameInput.addEventListener('input', () => {
      enrollBtn.disabled = sanitizeName(nameInput.value) === null;
    });
    enrollBtn.addEventListener('click', () => {
      if (!enrollCurrentBadge(nameInput.value)) {
        showFatal('Could not save. Tell the front desk.');
        return;
      }
      // Re-render into the greeting + item grid for the member we just enrolled.
      updateLockedScreen();
    });
    wireCancel();
    nameInput.focus();
  }
}

function wireCancel() {
  const btn = document.getElementById('cancel-btn');
  if (btn) btn.addEventListener('click', returnToIdle);
}

/* ============================================================
 * Item 4 — typed member number
 *
 * Not every member carries a card that scans, and a dead card must not mean a
 * member cannot buy anything. A typed number is also the obvious way to bill
 * somebody else's number, so the typed path asks for the NAME as well and
 * checks it against the one on file — a member who cannot say their own saved
 * name is not that member (PLAN §D4).
 * ============================================================ */

/** Case, spacing and punctuation are not evidence of anything. */
function normalizeNameForMatch(name) {
  return String(name).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function typedError(message) {
  const el = document.getElementById('typed-error');
  if (el) { el.textContent = message; el.hidden = false; }
  return false;
}

function clearTypedFields() {
  const number = document.getElementById('typed-number');
  const name = document.getElementById('typed-name');
  if (number) number.value = '';
  if (name) name.value = '';
  const err = document.getElementById('typed-error');
  if (err) err.hidden = true;
}

function openTypedEntry() {
  if (state !== 'idle') return;
  state = 'typing';
  // Camera off while somebody types: a card read mid-typing would otherwise
  // lock the kiosk onto whoever happened to walk past the lens.
  pauseScanner();
  clearTypedFields();
  showScreen('typing');
  const number = document.getElementById('typed-number');
  if (number && number.focus) number.focus();
  armInactivityTimer();
}

/**
 * "Not you?" on a typed sale. There is no card to re-bind, so go back to the
 * number they were typing — the rebind form is for scanned cards, and offering
 * it here would let anyone rename a member whose number they merely typed.
 */
function returnToTyping() {
  state = 'typing';
  const err = document.getElementById('typed-error');
  if (err) err.hidden = true;
  showScreen('typing');
  armInactivityTimer();
}

/**
 * Continue on the typing screen. Three outcomes, all of them explicit:
 * the number is unknown and the member is enrolled under the name they typed;
 * the number is known and the name matches (case/spacing/punctuation ignored);
 * or it is refused, in place, revealing nothing about who owns that number.
 */
function onTypedContinue() {
  if (state !== 'typing') return;
  const numberEl = document.getElementById('typed-number');
  const nameEl = document.getElementById('typed-name');
  const badgeId = normalizeBadgeId(numberEl ? numberEl.value : '');
  if (!badgeId) {
    return typedError('That doesn\u2019t look like a member number. Check the front of your card.');
  }
  const clean = sanitizeName(nameEl ? nameEl.value : '');
  const typedName = clean ? normalizeNameForMatch(clean) : '';
  if (!typedName) return typedError('Please type the name on your membership.');

  const members = loadState().members;
  const existing = members[badgeId];
  if (existing) {
    // Vague on purpose: naming the saved member would turn this screen into a
    // way to read other people's names off the kiosk.
    if (normalizeNameForMatch(existing.name) !== typedName) {
      return typedError('That number and name don\u2019t match. Please see the front desk.');
    }
  } else {
    // First time this number has been typed. Save it, then straight to the grid.
    const next = loadState();
    next.members[badgeId] = { name: clean, enrolledAt: new Date().toISOString() };
    if (!saveState(next)) {
      return typedError('Could not save. Please tell the front desk.');
    }
  }
  lockInMember(badgeId, 'typed');
}

function wireTypedEntry() {
  const open = document.getElementById('type-number-btn');
  const go = document.getElementById('typed-continue');
  const cancel = document.getElementById('typed-cancel');
  if (open) open.addEventListener('click', openTypedEntry);
  if (go) go.addEventListener('click', onTypedContinue);
  if (cancel) cancel.addEventListener('click', returnToIdle);
}
wireTypedEntry();

function wireQtyStepper() {
  const valueEl = document.getElementById('qty-value');
  const minus = document.getElementById('qty-minus');
  const plus = document.getElementById('qty-plus');
  const render = () => {
    valueEl.textContent = String(currentQty);
    minus.disabled = currentQty <= 1;
    plus.disabled = currentQty >= MAX_QTY;
  };
  minus.addEventListener('click', () => { if (currentQty > 1) currentQty--; render(); });
  plus.addEventListener('click', () => { if (currentQty < MAX_QTY) currentQty++; render(); });
  render();
}

function onProductTap(product) {
  // enterRecording() disables every product button synchronously, in this same
  // handler, so a double-tap on a lagging button cannot produce two sales.
  if (state !== 'locked') return;
  enterRecording();
  recordSale(product);
}

/**
 * HTML escape helper to prevent XSS.
 */
function escapeHtml(text) {
  // Previous version mapped each character to itself, so it escaped nothing.
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

/**
 * Unrecoverable-for-the-member error. Returns the kiosk to a usable state
 * rather than leaving it wedged mid-purchase.
 */
function showFatal(message) {
  alert(message);
  returnToIdle();
}

/* ============================================================
 * Task 6 — Sale capture
 * ============================================================ */
function recordSale(product) {
  if (state !== 'recording') return;
  
  // Build sale with snapshots
  const member = loadState().members[currentBadgeId];
  const sale = {
    id: crypto.randomUUID(),
    badgeId: currentBadgeId,
    memberName: member ? member.name : 'Unknown',
    productId: product.id,
    productName: product.name,   // snapshot
    sku: product.sku,            // snapshot
    price: product.price,        // snapshot (cents)
    qty: currentQty,
    at: new Date().toISOString(),
    entry: entryMode,            // 'scan' | 'typed' — how they identified
    batchId: null
  };
  
  // A failed write must never reach the success screen.
  if (addSale(sale)) {
    enterSuccess(sale);
  } else {
    // Go back to 'locked' and re-enable the grid so the member can retry.
    // Previously this left state='recording' with every button disabled,
    // wedging the kiosk until someone reloaded it.
    alert('Could not save that sale. Please tap the item again.');
    state = 'locked';
    updateLockedScreen();
  }
}

/* ============================================================
 * Task 7 — Export batches
 * ============================================================ */
function createBatch() {
  const state = loadState();
  // Voided sales are skipped: they have been corrected and must not be keyed
  // into the POS. The sale itself stays in `sales` with its batchId untouched,
  // so no history is rewritten and no id list ever shrinks.
  const pendingSales = state.sales.filter(s => s.batchId === null && !s.voidedAt);
  if (pendingSales.length === 0) return null;

  const batchId = crypto.randomUUID();
  pendingSales.forEach(s => { s.batchId = batchId; });
  
  const batch = {
    id: batchId,
    createdAt: new Date().toISOString(),
    saleIds: pendingSales.map(s => s.id),
    status: 'pending',
    processedAt: null,
    // Stamped on the batch itself so a later build knows this sheet may carry
    // v2 columns. Batches created before this are read as legacy unless one of
    // their sales was written by a v2 build (PLAN §D3).
    reportV: 2
  };
  state.batches.push(batch);
  if (saveState(state)) return batch;
  return null;
}

/**
 * Batch identity, for humans. `id` is a random UUID — fine as a key, useless
 * for a worker trying to say which batch they keyed. Every batch already
 * carries createdAt and processedAt, so a readable label needs no stored
 * counter and no migration; batches are minutes or days apart, so the
 * timestamp is unique in practice. The 8-char id stays on screen and on the
 * printout so a saved sheet can still be matched to its row.
 */
function fmtStamp(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return 'unknown time';
  return d.toLocaleString([], {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
  });
}

function batchLabel(batch) {
  return 'Batch \u2014 ' + fmtStamp(batch.createdAt);
}

/** The last thing that happened to this batch — what Wyatt asked to see. */
function lastActionLabel(batch) {
  return (batch.status === 'processed' && batch.processedAt)
    ? 'Keyed in ' + fmtStamp(batch.processedAt)
    : 'Created ' + fmtStamp(batch.createdAt);
}

/**
 * Build one batch's report once, in both forms. Print, the on-screen view and
 * Share all render the same numbers from here — three separate builders would
 * be three chances for the printed sheet and the shared copy to disagree about
 * what a member owes.
 */
function buildBatchReport(batchId) {
  const state = loadState();
  const batch = state.batches.find(b => b.id === batchId);
  if (!batch) return null;

  const batchSales = state.sales.filter(s => s.batchId === batchId);

  // Report v2 whenever this batch — or anything in it — was written by a build
  // that knows about v2. The second half of that test matters: a page still
  // running pre-deploy code can batch a sale that a newer page typed or voided,
  // and it will not have stamped anything. Rendering v2 on the strength of the
  // sales alone means TYPED and VOID can never be hidden by a stale writer
  // (PLAN §D3, review round 5).
  if (isV2Batch(batch, batchSales)) return buildV2Report(batch, batchSales);

  // ---- Legacy sheet, byte-for-byte what this batch was created with. ----
  // Invariant 3: a batch already printed and keyed in must reprint identically.
  // Truly old batches hold no voided sale (nothing could void one), so
  // filtering them out below cannot change a legacy rendering.
  const live = batchSales.filter(s => !s.voidedAt);
  const grouped = live.reduce((acc, s) => {
    if (!acc[s.memberName]) acc[s.memberName] = [];
    acc[s.memberName].push(s);
    return acc;
  }, {});

  const members = Object.keys(grouped).sort();
  const lineCount = live.length;
  const totalCents = live.reduce((sum, s) => sum + s.price * s.qty, 0);
  const shortId = batchId.slice(0, 8);
  const label = batchLabel(batch);
  const time = (s) => new Date(s.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  // Grouped by member so the worker keys one person's whole tab before
  // switching accounts. A rule above each member's first row makes the
  // groups scannable when you are halfway down the page.
  const html = `
    <img class="brand-report" src="logo.png" width="520" height="183"
         alt="Iron Jungle Family Fitness">
    <h1>Counter sales</h1>
    <p class="sub">
      ${escapeHtml(label)} &middot; ${escapeHtml(shortId)} &middot;
      ${lineCount} ${lineCount === 1 ? 'line' : 'lines'} &middot;
      ${members.length} ${members.length === 1 ? 'member' : 'members'}
    </p>
    <table>
      <thead>
        <tr><th>Member</th><th>Item</th><th>Qty</th><th>Amount</th><th>Time</th></tr>
      </thead>
      <tbody>
        ${members.map(m => grouped[m].map((s, i) => `
          <tr${i === 0 ? ' class="member-start"' : ''}>
            <td>${i === 0 ? escapeHtml(m) : ''}</td>
            <td>${escapeHtml(s.productName)}</td>
            <td>${s.qty}</td>
            <td>${formatPrice(s.price * s.qty)}</td>
            <td>${time(s)}</td>
          </tr>
        `).join('')).join('')}
        <tr class="total-row">
          <td>Total</td><td></td><td></td>
          <td>${formatPrice(totalCents)}</td><td></td>
        </tr>
      </tbody>
    </table>
  `;

  // Plain text for Share — pasteable into Notes or an email and readable
  // without any styling, which is the point of getting it off the iPad.
  const lines = [
    'Iron Jungle \u2014 counter sales',
    label + ' (' + shortId + ')',
    lineCount + (lineCount === 1 ? ' line' : ' lines') + ' \u00b7 ' +
      members.length + (members.length === 1 ? ' member' : ' members'),
    ''
  ];
  members.forEach(m => {
    lines.push(m);
    grouped[m].forEach(s => {
      lines.push('  ' + s.productName.padEnd(20) +
        ('x' + s.qty).padEnd(5) +
        formatPrice(s.price * s.qty).padStart(8) + '  ' + time(s));
    });
  });
  lines.push('', 'Total ' + formatPrice(totalCents));

  return { batch, label, shortId, html, text: lines.join('\n'), lineCount, totalCents };
}

function printBatch(batchId) {
  const report = buildBatchReport(batchId);
  if (!report) return;
  document.getElementById('print-container').innerHTML = report.html;
  window.print();
}

/**
 * Which report a batch gets (PLAN §D3). v2 when the batch itself was created by
 * a v2 build, or when anything in it was written by one — the stale-writer
 * case, where a page still running pre-deploy code batches a sale that a newer
 * page typed or voided and stamps nothing of its own.
 */
function isV2Batch(batch, batchSales) {
  return batch.reportV === 2 || batchSales.some(s => s.entry || s.voidedAt);
}

/** How a voided line reads on the sheet. Both renderings say the same thing. */
function voidMark(sale) {
  return sale.voidedBy === 'admin' ? 'VOID (admin)' : 'VOID (member undo)';
}

// The box the desk ticks by hand, once it has checked the number on a TYPED
// line against the POS (PLAN §D4). Ticking it is the gate, not the kiosk.
const DESK_CHECK_HTML = '<span class="desk-check">&#9744; desk checked</span>';
const DESK_CHECK_TEXT = '\u2610 desk checked';

/**
 * Report v2 — the legacy sheet plus the three things the desk actually needs:
 *
 *   - a **Member #** column: the worker keys by self-typed name, and two
 *     members sharing a name used to merge into a single group;
 *   - **TYPED** on every line that was typed in rather than scanned, with a box
 *     to tick once the number has been checked at the desk;
 *   - **VOID** on any line that has been undone, excluded from the line count
 *     and the total, so the sheet and the POS are asked for the same money.
 */
function buildV2Report(batch, batchSales) {
  const live = batchSales.filter(s => !s.voidedAt);
  const shortId = batch.id.slice(0, 8);
  const label = batchLabel(batch);
  const time = (s) => new Date(s.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  // Grouped by badge, not by name. The badge is what the POS keys on and what
  // the desk checks a typed line against, and it cannot be shared.
  const badgeIds = [];
  const grouped = {};
  for (const s of batchSales) {
    if (!grouped[s.badgeId]) { grouped[s.badgeId] = []; badgeIds.push(s.badgeId); }
    grouped[s.badgeId].push(s);
  }
  badgeIds.sort();

  const lineCount = live.length;
  const totalCents = live.reduce((sum, s) => sum + s.price * s.qty, 0);
  const memberCount = badgeIds.length;

  const marksHtml = (s) => {
    const out = [];
    if (s.entry === 'typed') out.push('<span class="typed-mark">TYPED</span> ' + DESK_CHECK_HTML);
    if (s.voidedAt) out.push('<span class="void-mark">' + escapeHtml(voidMark(s)) + '</span>');
    return out.join(' ');
  };

  const html = `
    <img class="brand-report" src="logo.png" width="520" height="183"
         alt="Iron Jungle Family Fitness">
    <h1>Counter sales</h1>
    <p class="sub">
      ${escapeHtml(label)} &middot; ${escapeHtml(shortId)} &middot;
      ${lineCount} ${lineCount === 1 ? 'line' : 'lines'} &middot;
      ${memberCount} ${memberCount === 1 ? 'member' : 'members'}
    </p>
    <table>
      <thead>
        <tr><th>Member</th><th>Member #</th><th>Item</th><th>Qty</th><th>Amount</th><th>Time</th><th>Desk</th></tr>
      </thead>
      <tbody>
        ${badgeIds.map(id => grouped[id].map((s, i) => `
          <tr class="${i === 0 ? 'member-start' : ''}${s.voidedAt ? ' void-row' : ''}">
            <td>${i === 0 ? escapeHtml(s.memberName) : ''}</td>
            <td>${escapeHtml(s.badgeId)}</td>
            <td>${escapeHtml(s.productName)}</td>
            <td>${s.qty}</td>
            <td>${formatPrice(s.price * s.qty)}</td>
            <td>${time(s)}</td>
            <td>${marksHtml(s)}</td>
          </tr>
        `).join('')).join('')}
        <tr class="total-row">
          <td>Total</td><td></td><td></td><td></td>
          <td>${formatPrice(totalCents)}</td><td></td><td></td>
        </tr>
      </tbody>
    </table>
  `;

  // Same plain-text shape as the legacy sheet, so a shared copy still pastes
  // into Notes and reads. The badge id rides on the group header line: that is
  // what makes two members with one name two visible groups.
  const lines = [
    'Iron Jungle \u2014 counter sales',
    label + ' (' + shortId + ')',
    lineCount + (lineCount === 1 ? ' line' : ' lines') + ' \u00b7 ' +
      memberCount + (memberCount === 1 ? ' member' : ' members'),
    ''
  ];
  badgeIds.forEach(id => {
    lines.push(grouped[id][0].memberName + ' \u2014 ' + id);
    grouped[id].forEach(s => {
      const marks = [];
      if (s.entry === 'typed') marks.push('TYPED ' + DESK_CHECK_TEXT);
      if (s.voidedAt) marks.push(voidMark(s).toUpperCase());
      lines.push('  ' + s.productName.padEnd(20) +
        ('x' + s.qty).padEnd(5) +
        formatPrice(s.price * s.qty).padStart(8) + '  ' + time(s) +
        (marks.length ? '  ' + marks.join('  ') : ''));
    });
  });
  lines.push('', 'Total ' + formatPrice(totalCents));

  return { batch, label, shortId, html, text: lines.join('\n'), lineCount, totalCents };
}

/* The batch currently open in the on-screen view, so its own Print and Share
 * buttons know what they are acting on. */
let viewedBatchId = null;

/**
 * Show a batch on screen. The report was previously built only into
 * #print-container, which is display:none outside @media print — so the one
 * way to read a batch was the OS print sheet, and on an iPad with no printer
 * set up that meant no way to read it at all. Keying sales into the gym
 * software needs to read the batch, not print it.
 */
function viewBatch(batchId) {
  const report = buildBatchReport(batchId);
  if (!report) return;
  viewedBatchId = batchId;
  document.getElementById('batch-view-title').textContent = report.label;
  document.getElementById('batch-view-body').innerHTML = report.html;
  // Share is not offered where the platform cannot do it (desktop browsers,
  // and any iOS build without the Web Share API).
  const shareBtn = document.getElementById('batch-view-share');
  if (shareBtn) shareBtn.hidden = !canShareBatch();
  document.getElementById('batch-view').hidden = false;
}

function closeBatchView() {
  viewedBatchId = null;
  document.getElementById('batch-view').hidden = true;
}

function printViewedBatch() {
  if (viewedBatchId) printBatch(viewedBatchId);
}

function canShareBatch() {
  return typeof navigator !== 'undefined' && typeof navigator.share === 'function';
}

/**
 * Hand the batch to iOS's own share sheet — Save to Files, Mail, Notes,
 * AirDrop. This is the answer to "there is no way to pull the form off the
 * iPad": it needs no printer and no PDF trick.
 */
function shareBatch(batchId) {
  const report = buildBatchReport(batchId);
  if (!report) return;
  if (!canShareBatch()) {
    alert('Sharing is not available on this device. Use Print instead.');
    return;
  }
  // A share the worker dismisses rejects with AbortError. That is a normal
  // outcome, not a failure worth a dialog at the counter.
  Promise.resolve(navigator.share({
    title: 'Iron Jungle \u2014 ' + report.label,
    text: report.text
  })).catch((e) => {
    if (e && e.name === 'AbortError') return;
    console.error('Share failed:', e);
    alert('Could not share that batch. Use Print instead.');
  });
}

function shareViewedBatch() {
  if (viewedBatchId) shareBatch(viewedBatchId);
}

function confirmBatch(batchId) {
  const state = loadState();
  const batch = state.batches.find(b => b.id === batchId);
  if (!batch) return false;
  // Refuse to re-confirm an already-processed batch. A second call must not
  // overwrite processedAt (that would silently move a confirmed batch's
  // timestamp and could re-key an export that was already entered).
  if (batch.status === 'processed') return false;
  batch.status = 'processed';
  batch.processedAt = new Date().toISOString();
  return saveState(state);
}

/* ============================================================
 * Task 8 — PIN-gated admin + the three Task 7 report gaps
 * ============================================================ */

// FILL IN: placeholder admin PIN. Change to the real PIN before the iPad goes
// on the counter.
var ADMIN_PIN = '0311';

/**
 * Shown in the admin footer, and bumped on every deploy (PLAN §E2). It is the
 * only way to tell a page still serving yesterday's shell from the one that was
 * just pushed — a force-reload alone proves nothing when a service worker is
 * between the browser and the network. `var`, not `let`: it is read from the
 * console and from tests as a window property.
 */
var BUILD = '2026-09-18.4';

let adminAttempts = 0;
let adminLockoutUntil = 0;
const ADMIN_MAX_ATTEMPTS = 3;
const ADMIN_LOCKOUT_MS = 30 * 1000;

function tryAdminUnlock(pin) {
  if (adminLockoutRemainingMs() > 0) return false;
  if (pin === ADMIN_PIN) {
    resetAdminLockout();
    return true;
  }
  adminAttempts++;
  if (adminAttempts >= ADMIN_MAX_ATTEMPTS) {
    adminLockoutUntil = Date.now() + ADMIN_LOCKOUT_MS;
  }
  return false;
}

function adminLockoutRemainingMs() {
  const remaining = adminLockoutUntil - Date.now();
  return remaining > 0 ? remaining : 0;
}

function resetAdminLockout() {
  adminAttempts = 0;
  adminLockoutUntil = 0;
}

function pendingSaleCount() {
  const state = loadState();
  // A voided sale is not waiting for anything: it must never reach the POS.
  return state.sales.filter(s => s.batchId === null && !s.voidedAt).length;
}

function listAdminBatches() {
  const state = loadState();
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const pending = state.batches.filter(b => b.status === 'pending');
  const processed = state.batches.filter(b => {
    if (b.status !== 'processed') return false;
    const at = b.processedAt ? new Date(b.processedAt).getTime() : 0;
    return at >= cutoff;
  });
  return pending.concat(processed);
}

function clearAllData(confirmText) {
  const state = loadState();
  if (state.batches.some(b => b.status === 'pending')) {
    return { ok: false, reason: 'pending' };
  }
  // A day of un-pulled sales must not be one word from gone. Refusing only on a
  // PENDING BATCH left the unbatched case wide open, and unbatched sales are
  // exactly the ones nobody has copied out yet. Voided sales are not waiting for
  // anything, so they do not hold the wipe up.
  if (state.sales.some(s => s.batchId === null && !s.voidedAt)) {
    return { ok: false, reason: 'waiting' };
  }
  if (confirmText !== 'CLEAR') {
    return { ok: false, reason: 'confirm' };
  }
  state.sales = [];
  state.batches = [];
  state.members = {};
  return saveState(state) ? { ok: true } : { ok: false, reason: 'save' };
}

function doCreateBatch() {
  if (createBatch()) {
    alert('Batch created.');
    renderAdmin();
  } else {
    alert('No sales to batch.');
  }
}

function doConfirmBatch(id) {
  if (confirmBatch(id)) {
    alert('Batch marked processed.');
    renderAdmin();
  } else {
    alert('Already processed, or not found.');
  }
}

function renderAdmin() {
  const container = document.getElementById('admin-batches');
  const batches = listAdminBatches();
  const unexported = pendingSaleCount();

  const corruptNote = corrupted
    ? '<p class="warn-note">Storage was quarantined as corrupt at last load. ' +
      'Earlier sales may be missing.</p>'
    : '';

  const rows = batches.map(b => {
    const pending = b.status === 'pending';
    return `
      <div class="batch">
        <span class="batch-id">${escapeHtml(batchLabel(b))}</span>
        <span class="pill ${pending ? 'pending' : 'processed'}">${pending ? 'Pending' : 'Keyed in'}</span>
        <span class="batch-meta">${b.saleIds.length} ${b.saleIds.length === 1 ? 'sale' : 'sales'}</span>
        <span class="spacer"></span>
        <button class="btn-sm" onclick='viewBatch("${b.id}")'>View</button>
        ${canShareBatch() ? `<button class="btn-sm" onclick='shareBatch("${b.id}")'>Share</button>` : ''}
        <button class="btn-sm" onclick='printBatch("${b.id}")'>Print</button>
        ${pending ? `<button class="btn-sm solid" onclick='doConfirmBatch("${b.id}")'>Confirm keyed</button>` : ''}
        <span class="batch-row-2">
          <span class="batch-last">${escapeHtml(lastActionLabel(b))}</span>
          <span class="batch-last">&middot; ${escapeHtml(b.id.slice(0, 8))}</span>
        </span>
      </div>
    `;
  }).join('');

  const empty = batches.length ? '' :
    `<p class="empty">No batches yet. ${unexported
      ? unexported + ' sale' + (unexported === 1 ? '' : 's') + ' waiting \u2014 create a batch to print them.'
      : 'Sales will appear here once members start buying.'}</p>`;

  container.innerHTML = corruptNote + '<h3>Batches</h3>' + rows + empty;

  // Put the waiting count next to the action it affects, and don't offer a
  // button that would do nothing.
  const createBtn = document.getElementById('create-batch-btn');
  const note = document.getElementById('waiting-note');
  if (createBtn) createBtn.disabled = unexported === 0;
  if (note) {
    note.textContent = unexported === 0
      ? 'Nothing waiting'
      : unexported + ' sale' + (unexported === 1 ? '' : 's') + ' waiting';
  }

  // The build this page is actually running. Bumped on every deploy, and the
  // only honest answer to "did the iPad pick the push up?" — a force-reload
  // proves nothing while a service worker sits in front of the network.
  const statusEl = document.getElementById('admin-status');
  if (statusEl) statusEl.textContent = 'build ' + BUILD;
}

function doClearData() {
  // The old prompt offered to delete "N unexported sale(s)" — which was exactly
  // what it used to do, and exactly what it must never do. Anything still
  // waiting now blocks the wipe, so by the time a worker sees this dialog the
  // only thing left to lose is members and already-keyed history.
  const r = clearAllData(prompt(
    'This permanently deletes all members and all keyed-in batches and sales. ' +
    'Type CLEAR to confirm.'
  ));
  if (!r.ok) {
    alert(r.reason === 'pending'
      ? 'Cannot clear while a batch is pending. Confirm or void it first.'
      : r.reason === 'waiting'
      ? 'Cannot clear while sales are waiting. Create a batch, print it and key it in first.'
      : 'Clear cancelled — you must type CLEAR exactly.');
    return;
  }
  alert('All data cleared.');
  renderAdmin();
}

function showAdminPinPrompt() {
  const pin = prompt('Admin PIN:');
  if (pin === null) return;
  if (tryAdminUnlock(pin)) {
    // Admin is a state of its own, not just another screen. Without this the
    // kiosk stayed `idle` with the scanner live behind the PIN gate, so a card
    // in view while a worker was in admin fired enterLocked and yanked them
    // onto a member's grid — and Confirm and Clear sat exposed to anyone who
    // wandered up to the counter.
    state = 'admin';
    pauseScanner();
    renderAdmin();
    showScreen('admin');
    armInactivityTimer();
  } else {
    const remaining = adminLockoutRemainingMs();
    alert(remaining > 0
      ? 'Locked out for ' + Math.ceil(remaining / 1000) + 's.'
      : 'Incorrect PIN.');
  }
}

// Long-press (~800ms) the idle title is the ONLY route into the admin screen.
// Hiding the screen is not gating it — the pin check above is.
function wireAdminEntry() {
  const title = document.getElementById('idle-title');
  if (!title) return;
  let pressTimer = null;
  const start = () => {
    if (pressTimer) clearTimeout(pressTimer);
    pressTimer = setTimeout(showAdminPinPrompt, 800);
  };
  const cancel = () => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  };
  title.addEventListener('touchstart', start);
  title.addEventListener('touchend', cancel);
  title.addEventListener('touchcancel', cancel);
  title.addEventListener('mousedown', start);
  title.addEventListener('mouseup', cancel);
  title.addEventListener('mouseleave', cancel);
}
wireAdminEntry();

/**
 * Kiosk gesture hardening.
 *
 * iOS deliberately ignores `user-scalable=no` and `maximum-scale` for
 * accessibility, and `touch-action: manipulation` does not reliably suppress
 * Safari's double-tap smart zoom in a standalone home-screen app — verified on
 * the real iPad, where a fast double-tap still lifted the page and exposed the
 * #111 app shell underneath. CSS cannot hold the visual viewport down, so
 * cancel the second tap of a double-tap ourselves.
 *
 * Because maximum-scale is 1.0 the magnification never happens, so the symptom
 * is the page shifting up at the SAME size with the #111 shell showing below —
 * the scroll half of the gesture, with nothing to scroll.
 *
 * Scoping: preventDefault on touchend also cancels that tap's click, so this
 * cancels the second tap everywhere EXCEPT controls that opt in with
 * `data-rapid`. The only place a fast second activation means anything is the
 * qty stepper. On a product button the second tap is already discarded by the
 * duplicate-sale guard, so cancelling it costs nothing — that is exactly the
 * "double-tap a product, get one sale" case. The admin long-press is
 * unaffected; it runs off touchstart/touchend listeners, which still fire.
 */
function wireKioskGestures() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    const rapidOk = e.target && e.target.closest && e.target.closest('[data-rapid]');
    if (!rapidOk && now - lastTouchEnd <= 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // Belt and braces for the displacement itself. The kiosk is exactly one
  // viewport tall and nothing at document level is ever meant to scroll, so if
  // anything displaces it — the gesture above slipping through, a keyboard
  // dismissal — put it back. Skipped while a text field is focused, because
  // there iOS scrolls the input into view on purpose and fighting it would hide
  // the field the member is typing in.
  window.addEventListener('scroll', () => {
    const el = document.activeElement;
    if (el && el.tagName === 'INPUT') return;
    if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
      window.scrollTo(0, 0);
    }
  }, { passive: true });

  // Pinch zoom fires gesture* on iOS. A zoomed kiosk is a stuck kiosk — the
  // member cannot undo it and the next person inherits it. Tap targets are
  // 88px and the type is large precisely so nobody needs to zoom.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
    document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  });
}
wireKioskGestures();

/* ============================================================
 * Scanner Integration (Task 1 + 4)
 * ============================================================ */
function startScanner() {
  if (scannerInstance) return;
  try {
    // formatsToSupport is read by the CONSTRUCTOR only — the library ignores it
    // in start()'s config. Gym keytags are Code 39 ("IJG18399"); Code 128 is
    // here because the same alphanumeric payload is sometimes encoded that way.
    // CALIBRATION KNOB: if a member's card won't read, add its format here, not
    // in start(). Deliberately NOT enabling ITF/UPC/EAN — no gym card uses them
    // and ITF happily decodes part of a symbol as a valid shorter code, which
    // would hand us a plausible wrong badge ID.
    scannerInstance = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_128
      ]
    });
  } catch (e) {
    // Thrown synchronously when the #reader element is missing.
    console.error('Failed to construct scanner:', e);
    showScannerError('Scanner failed to load. Tell the front desk.');
    return;
  }
  // start() is async — a denied or missing camera rejects the promise and is
  // NOT catchable by a try/catch around this call.
  scannerInstance.start(
    // MUST be exactly one key. The library rejects any other shape with
    // "'cameraIdOrConfig' object should have exactly 1 key" — resolution hints
    // belong in videoConstraints below, not here.
    { facingMode: "environment" },
    {
      fps: 10,
      // NO qrbox, deliberately. Setting one turns on the library's own shaded
      // box, which injects a second set of corner brackets inside .scan-frame's
      // — that was the odd double-corner look on the iPad. Omitting it also
      // makes the decode region the WHOLE frame, which is what we want here:
      // the library maps its region to source pixels with videoWidth/clientWidth
      // per axis, i.e. assuming the video is stretched to fill #reader, but our
      // CSS forces object-fit: cover, which crops. Any sub-region therefore
      // decodes a different area than the member can see. Full frame has no
      // such mismatch, and a keytag anywhere in view reads.
      // CALIBRATION KNOB: if this is too slow on the iPad, drop the resolution
      // below rather than reintroducing a qrbox.
      // 720p, not 1080p. The whole frame is decoded now, so 1080p would push
      // ~2MP through the decoder ten times a second and throttle an iPad over a
      // gym shift. 720p still leaves 1280 source pixels across the card, plenty
      // for Code 39's narrow bars. When present this replaces cameraIdOrConfig
      // for getUserMedia, so it has to carry facingMode itself.
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    },
    onScanSuccess,
    onScanError
  ).catch(e => {
    console.error('Failed to start camera:', e);
    // Name the reason. A config error and a denied permission are both "camera
    // unavailable" from the counter, and sending a worker into Settings for a
    // config bug wasted a gym visit once already.
    showScannerError('Camera unavailable (' + String(e && e.message || e).slice(0, 60) +
      '). Check camera permission in Settings, then reload.');
  });
}

function pauseScanner() {
  try {
    if (scannerInstance) scannerInstance.pause(true);
  } catch (e) {
    console.warn('pause failed:', e);
  }
}

function resumeScanner() {
  try {
    if (scannerInstance) scannerInstance.resume();
  } catch (e) {
    // Resuming a scanner that is already scanning throws; harmless.
    console.warn('resume failed:', e);
  }
}

/**
 * Bring a suspended camera back.
 *
 * iOS suspends a <video> as soon as the page is obscured, and html5-qrcode
 * never notices: the preview freezes and the kiosk silently stops scanning.
 * Found via an overscroll pull with Guided Access off, but the gesture is only
 * one trigger — a notification shade, the app backgrounding, exiting and
 * re-entering Guided Access, or the iPad sleeping all do the same thing, and
 * Guided Access blocks none of those. A frozen scanner is the worst failure
 * this kiosk has: a member waves their card, nothing happens, they walk off,
 * and the sale goes unrecorded — precisely the loss it exists to prevent, and
 * invisible in the data afterwards because nothing was written.
 */
function reviveScanner() {
  // Mid-purchase the camera is paused on purpose; leave it alone.
  if (state !== 'idle') return;
  if (!scannerInstance) { startScanner(); return; }

  const video = document.querySelector('#reader video');
  const track = video && video.srcObject && video.srcObject.getVideoTracks
    ? video.srcObject.getVideoTracks()[0]
    : null;

  // A track iOS actually ended cannot be replayed — rebuild the scanner.
  if (track && track.readyState === 'ended') { restartScanner(); return; }

  // Otherwise it is only paused, which play() undoes.
  if (video && video.paused) {
    Promise.resolve(video.play()).catch((e) => {
      console.warn('video resume failed, rebuilding scanner:', e);
      restartScanner();
    });
  }
  // And html5-qrcode may still believe it is paused from a previous sale.
  resumeScanner();
}

/** Tear the scanner down and stand a fresh one up. */
function restartScanner() {
  const old = scannerInstance;
  scannerInstance = null;
  const again = () => { if (state === 'idle') startScanner(); };
  if (!old) { again(); return; }
  // stop() can be missing or throw synchronously. scannerInstance is already
  // null by here, so letting that escape would leave the kiosk with no scanner
  // at all and nothing to rebuild it — a dead camera for the rest of the shift.
  try {
    Promise.resolve(old.stop()).catch((e) => console.warn('stop failed:', e)).then(again);
  } catch (e) {
    console.warn('stop threw:', e);
    again();
  }
}

function wireScannerRecovery() {
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) reviveScanner();
  });
  // visibilitychange does not always fire for a partially obscured page.
  window.addEventListener('focus', reviveScanner);
  // Only a back-forward-cache restore. Plain `pageshow` fires on every normal
  // load, where enterIdle has just started the scanner — reviving there cost a
  // redundant camera restart on every launch.
  window.addEventListener('pageshow', (e) => { if (e && e.persisted) reviveScanner(); });
}
wireScannerRecovery();

function onScanSuccess(decodedText) {
  // Primary guard: only accept scans from idle state
  if (state !== 'idle') return;
  // Secondary guard: a badge left sitting in frame must not immediately
  // re-trigger when the camera resumes after the previous sale.
  if (Date.now() < scanLockoutUntil) return;

  // Reject anything that isn't shaped like a gym card BEFORE pausing the
  // camera — a garbage read must look like no read at all, not stall the kiosk.
  const badgeId = normalizeBadgeId(decodedText);
  if (!badgeId) {
    console.warn('Ignoring implausible badge read:', decodedText);
    return;
  }

  // Pause camera immediately (primary fix)
  pauseScanner();

  currentBadgeId = badgeId;
  enterLocked(currentBadgeId);
}

function onScanError() {
  // Called for EVERY frame that fails to decode — ~10/sec, all day, while the
  // kiosk sits idle with nothing in front of the lens. Logging here grew the
  // console buffer without bound on a device nobody can open a console on.
  // Intentionally empty: a frame that doesn't decode is not an error.
}

function showScannerError(message) {
  // Write into a dedicated node — replacing the whole idle screen would
  // destroy #reader, which the scanner needs to mount into.
  const el = document.getElementById('scanner-error');
  el.textContent = message;
  el.hidden = false;
}

/* ============================================================
 * Task 2 & 3 — demo() self-checks (updated for state machine)
 * ============================================================ */
function demoStorage() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  // This function is destructive — it clears storage and writes garbage on
  // purpose. Snapshot everything first and restore it on the way out, so
  // running it against a kiosk that holds real sales cannot lose them.
  const snapshot = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    snapshot[k] = localStorage.getItem(k);
  }
  const wasCorrupted = corrupted;
  try {

  localStorage.clear();
  const s1 = loadState();
  assert(s1.schema === 1 && Array.isArray(s1.sales) && Array.isArray(s1.batches), 'default shape has schema=1');

  const sale = {
    id: 's-test-1', badgeId: 'B1', memberName: 'Jane D.',
    productId: 'water', productName: 'Water', sku: 'water',
    price: 200, qty: 1, at: new Date().toISOString(), batchId: null
  };
  assert(addSale(sale) === true, 'addSale returns true');
  assert(loadState().sales.length === 1, 'sale round-trips');

  const origSet = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function () { throw new Error('QuotaExceededError'); };
  assert(addSale(Object.assign({}, sale, { id: 's-test-2' })) === false, 'addSale returns false when setItem throws');
  localStorage.setItem = origSet;
  assert(loadState().sales.length === 1, 'failed addSale does not persist');

  localStorage.setItem(STORAGE_KEY, '{not valid json!!');
  const s4 = loadState();
  assert(corrupted === true, 'corrupted flag set after garbage write');
  assert(s4.sales.length === 0, 'loadState quarantines');

  } finally {
    // Restore the real data and the real corruption flag.
    localStorage.clear();
    for (const k of Object.keys(snapshot)) localStorage.setItem(k, snapshot[k]);
    corrupted = wasCorrupted;
  }

  return results;
}

function demoCatalog() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  assert(validateCatalog(CATALOG) === true, 'default CATALOG is valid');

  let dupSkuThrew = false;
  try {
    validateCatalog([
      { id: 'a', name: 'A', sku: 'DUP', price: 100 },
      { id: 'b', name: 'B', sku: 'DUP', price: 200 }
    ]);
  } catch (e) {
    dupSkuThrew = true;
  }
  assert(dupSkuThrew, 'duplicate SKU throws at startup');

  let dupIdThrew = false;
  try {
    validateCatalog([
      { id: 'DUP', name: 'A', sku: 'a', price: 100 },
      { id: 'DUP', name: 'B', sku: 'b', price: 200 }
    ]);
  } catch (e) {
    dupIdThrew = true;
  }
  assert(dupIdThrew, 'duplicate id throws at startup');

  let emptyNameThrew = false;
  try {
    validateCatalog([{ id: 'a', name: '   ', sku: 'a', price: 100 }]);
  } catch (e) {
    emptyNameThrew = true;
  }
  assert(emptyNameThrew, 'empty name throws at startup');

  return results;
}

/* ============================================================
 * Task 4 — State machine self-check
 * ============================================================ */
function demoScanner() {
  const results = [];
  function assert(cond, label) {
    results.push({ ok: !!cond, label });
    if (!cond) console.error('FAIL:', label);
  }

  // Reset state
  state = 'idle';
  currentBadgeId = null;
  scanLockoutUntil = 0;

  // Mock scanner functions
  let paused = false;
  const mockPause = () => { paused = true; };
  const mockResume = () => { paused = false; };
  
  // Temporarily replace scanner functions
  const originalPause = pauseScanner;
  const originalResume = resumeScanner;
  const originalInstance = scannerInstance;
  pauseScanner = mockPause;
  resumeScanner = mockResume;
  // Stand in for a started camera. enterIdle() resumes an existing instance and
  // only constructs one when there is none, so without this the cancel test
  // takes the construct path and never calls resume.
  scannerInstance = scannerInstance || {};

  try {
    // Test: idle -> scan -> locked
    onScanSuccess('TEST_BADGE');
    assert(state === 'locked', 'First scan should lock state');
    assert(paused === true, 'Scanner should pause on lock');
    
    // Test: locked -> second scan ignored
    const wasPaused = paused;
    onScanSuccess('OTHER_BADGE');
    assert(state === 'locked', 'State should remain locked');
    assert(paused === wasPaused, 'Scanner pause state should be unchanged');
    
    // Test: cancel returns to idle and resumes
    returnToIdle();
    assert(state === 'idle', 'Cancel should return to idle');
    assert(paused === false, 'Scanner should resume after cancel');
    
  } finally {
    // Restore original functions
    pauseScanner = originalPause;
    resumeScanner = originalResume;
    scannerInstance = originalInstance;
  }

  return results;
}

/**
 * Self-checks are DEVELOPER tools and must never run on their own.
 *
 * They used to run on every page load. demoStorage() clears localStorage and
 * writes garbage to the real key, so every reload of the kiosk quarantined the
 * live data as corrupt and started empty — a full day of uncollected sales
 * destroyed by any reload, iOS memory-pressure relaunch, or Guided Access
 * restart. Silent, and with a false "storage was corrupt" banner on top.
 *
 * Opt in explicitly with ?selftest=1 when you want them.
 */
function runSelfChecks() {
  return {
    storage: demoStorage(),
    catalog: demoCatalog(),
    scanner: demoScanner()
  };
}
if (typeof window !== 'undefined' && window.location
    && /[?&]selftest=1\b/.test(window.location.search)) {
  console.log('Self-checks:', runSelfChecks());
}

/* ============================================================
 * Startup
 *
 * This must be explicit. The app previously booted only by accident: the
 * self-checks auto-ran on load and demoScanner() called returnToIdle(), which
 * happened to show the idle screen. Removing that auto-run left every .screen
 * hidden and the page blank.
 * ============================================================ */
if (typeof window !== 'undefined' && window.document) {
  enterIdle();
}
</script>
