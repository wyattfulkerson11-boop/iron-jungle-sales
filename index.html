<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="vendor/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: #111; color: #eee; height: 100vh; user-select: none; }
  .screen { display: none; height: 100vh; padding: 20px; }
  .screen.active { display: flex; flex-direction: column; }
  .btn { padding: 15px; background: #333; color: white; border: none; border-radius: 8px; font-size: 18px; margin-top: 10px; }
  input { padding: 15px; font-size: 18px; border-radius: 8px; border: 1px solid #444; }
  .qty-ctrl { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
</style>
</head>
<body>

<div id="idle" class="screen active">
  <div id="reader" style="width:100%; max-width:500px; margin:0 auto;"></div>
</div>

<div id="locked" class="screen">
  <h2 id="greet">Hello</h2>
  <div id="enroll-ui" style="display:none; flex-direction:column;">
    <input type="text" id="name-input" placeholder="Enter Name">
    <button class="btn" id="enroll-btn">Enroll</button>
  </div>
  <button class="btn" id="not-me-btn" style="display:none;">Not me?</button>
  
  <div class="qty-ctrl">
    <button class="btn" id="qty-dec">-</button>
    <span id="qty-val" style="font-size: 24px;">1</span>
    <button class="btn" id="qty-inc">+</button>
  </div>

  <div id="catalog-container"></div>
  <button class="btn" id="cancel-btn">Cancel</button>
</div>

<div id="success" class="screen"><h2>Sale Recorded!</h2></div>

<script>
'use strict';
const CATALOG = [{ id: 'water', name: 'Water', sku: 'water', price: 150 }];
let state = 'idle';
let currentBadgeId = null;
let qty = 1;

function setState(newState) {
  state = newState;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(state === 'recording' ? 'locked' : state).classList.add('active');
  
  if (state === 'locked') {
    const member = loadState().members[currentBadgeId];
    if (member) {
      document.getElementById('greet').textContent = `Hello, ${member.name}`;
      document.getElementById('enroll-ui').style.display = 'none';
      document.getElementById('not-me-btn').style.display = 'block';
    } else {
      document.getElementById('greet').textContent = `New Member!`;
      document.getElementById('enroll-ui').style.display = 'flex';
      document.getElementById('not-me-btn').style.display = 'none';
    }
  }
}

document.getElementById('qty-inc').onclick = () => { if (qty < 10) qty++; document.getElementById('qty-val').textContent = qty; };
document.getElementById('qty-dec').onclick = () => { if (qty > 1) qty--; document.getElementById('qty-val').textContent = qty; };

function onScanSuccess(decodedText) {
  if (state !== 'idle') return;
  currentBadgeId = decodedText;
  setState('locked');
}

// Sale capture (Task 6)
function recordSale(product) {
  if (state !== 'locked') return;
  setState('recording');
  
  const sale = {
    id: crypto.randomUUID(),
    badgeId: currentBadgeId,
    memberName: loadState().members[currentBadgeId].name,
    productId: product.id,
    productName: product.name,
    sku: product.sku,
    price: product.price,
    qty: qty,
    at: new Date().toISOString(),
    batchId: null
  };
  
  if (addSale(sale)) {
    setState('success');
    setTimeout(() => { setState('idle'); qty = 1; document.getElementById('qty-val').textContent = 1; }, 2000);
  } else {
    alert("Error saving sale");
    setState('locked');
  }
}

// Storage helpers
const STORAGE_KEY = 'ij.v1';
function loadState() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"schema":1,"members":{},"sales":[],"batches":[]}'); }
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); return true; }
function addSale(sale) { const s = loadState(); s.sales.push(sale); return saveState(s); }

// UI
CATALOG.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = p.name;
  btn.onclick = () => recordSale(p);
  document.getElementById('catalog-container').appendChild(btn);
});

const scanner = new Html5Qrcode("reader");
scanner.start({ facingMode: "user" }, { fps: 10 }, onScanSuccess);
</script>
</body>
</html>
